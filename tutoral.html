<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Video Selector</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: serif display + monospace to match the Tilth login page -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .topbar {
            width: 100%;
            max-width: 960px;
            margin: 0 auto 18px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8bc34a;
        }

        .brand-icon svg {
            display: block;
        }

        .brand-text h1 {
            margin: 0;
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 600;
            font-size: 20px;
            color: #ece8dd;
            line-height: 1.1;
        }

        .brand-text span {
            display: block;
            font-family: 'Space Mono', 'Courier New', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: #8a8578;
            margin-top: 2px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: transparent;
            border: 1px solid #2c2a22;
            color: #ece8dd;
            padding: 9px 16px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        .back-btn:hover {
            border-color: #8bc34a;
            color: #8bc34a;
        }

        @media (max-width: 480px) {
            .brand-text h1 {
                font-size: 17px;
            }

            .back-btn span {
                display: none;
            }

            .back-btn {
                padding: 9px 12px;
            }
        }

        :root {
            --bg-black: #14110d;
            --panel-dark: #1a1713;
            --primary-green: #8bc34a;
            --dark-green: #33301f;
            --hover-green: #79ab3c;
            --text-light: #ece8dd;
            --text-muted: #8a8578;
            --border-color: #2c2a22;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-light);
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--panel-dark);
            border: 1px solid var(--dark-green);
            padding: clamp(18px, 4vw, 30px);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 960px;
            margin: 0;
            text-align: center;
        }

        .eyebrow {
            font-family: 'Space Mono', 'Courier New', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary-green);
            margin-bottom: 10px;
        }

        h2 {
            margin: 0 0 12px 0;
            color: var(--text-light);
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 700;
            font-size: clamp(22px, 4.5vw, 30px);
            letter-spacing: 0.3px;
            line-height: 1.25;
        }

        h2 span {
            color: var(--primary-green);
        }

        .tagline {
            font-family: 'Space Mono', 'Courier New', monospace;
            font-size: clamp(11px, 2.6vw, 13px);
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 4px;
        }

        .search-container {
            position: relative;
            margin-bottom: 20px;
        }

        #cropSearch {
            width: 100%;
            padding: 12px 15px;
            background-color: #0a0a0a;
            border: 1px solid var(--dark-green);
            border-radius: 6px;
            color: var(--text-light);
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        #cropSearch:focus {
            border-color: var(--primary-green);
        }

        #dropdownList {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #0a0a0a;
            border: 1px solid var(--dark-green);
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 10;
            text-align: left;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #dropdownList li {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        #dropdownList li:last-child {
            border-bottom: none;
        }

        #dropdownList li:hover {
            background-color: var(--dark-green);
            color: #ffffff;
        }

        .action-panel {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
        }

        .action-panel .btn {
            flex: 1;
            min-width: min(200px, 100%);
        }

        .btn {
            border: none;
            padding: 12px 16px;
            font-size: clamp(13px, 3.2vw, 16px);
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            white-space: nowrap;
            transition: background-color 0.3s, transform 0.1s;
            pointer-events: none;
            opacity: 0.5;
        }

        .btn.active {
            pointer-events: auto;
            opacity: 1;
        }

        .yt-btn {
            background-color: #ff0000;
            color: white;
        }

        .yt-btn:hover.active {
            background-color: #cc0000;
        }

        /* Watch It Here Button styling */
        .watch-here-btn {
            background-color: var(--dark-green);
            color: white;
            border: 1px solid var(--primary-green);
        }

        .watch-here-btn:hover.active {
            background-color: var(--hover-green);
        }

        /* Embedded Player */
        .player-wrapper {
            display: none;
            margin-top: 18px;
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 aspect ratio */
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            border: 1px solid var(--dark-green);
        }

        .player-wrapper.show {
            display: block;
        }

        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .close-player-btn {
            display: none;
            margin-top: 10px;
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .close-player-btn.show {
            display: inline-flex;
        }

        .close-player-btn:hover {
            border-color: var(--primary-green);
            color: var(--primary-green);
        }

        /* Leaf SVG icon styling */
        .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .container {
                border-radius: 10px;
            }

            .eyebrow {
                letter-spacing: 1.5px;
            }

            #dropdownList {
                max-height: 160px;
            }

            .action-panel {
                flex-direction: column;
            }

            .action-panel .btn {
                width: 100%;
            }
        }
    </style>
</head>

    <div class="container">
        <div class="eyebrow">Field Reading</div>
        <h2>Every crop has <span>a story.</span></h2>
        <p class="tagline">"Watch, learn, and grow — one field at a time." Pick your crop below to see it done right.</p>
        
        <div class="search-container">
            <input type="text" id="cropSearch" placeholder="Type crop name (e.g., Wheat, Rice)..." autocomplete="off">
            <ul id="dropdownList"></ul>
        </div>

        <div class="action-panel">
            <!-- Option 1: YouTube Icon Link -->
            <a id="ytLinkBtn" class="btn yt-btn" href="#" target="_blank">
                <i class="fa-brands fa-youtube"></i> Watch on YouTube
            </a>

            <!-- Option 2: Watch It Here -->
            <button id="watchHereBtn" class="btn watch-here-btn">
                <i class="fa-solid fa-play"></i> Watch It Here
            </button>
        </div>

        <!-- Embedded YouTube Player -->
        <div class="player-wrapper" id="playerWrapper">
            <iframe id="ytPlayerFrame"
                src=""
                title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>
        <button id="closePlayerBtn" class="close-player-btn">
            <i class="fa-solid fa-xmark"></i>&nbsp; Close Player
        </button>
    </div>

        const searchInput = document.getElementById('cropSearch');
        const dropdownList = document.getElementById('dropdownList');
        const ytLinkBtn = document.getElementById('ytLinkBtn');
        const watchHereBtn = document.getElementById('watchHereBtn');
        const playerWrapper = document.getElementById('playerWrapper');
        const ytPlayerFrame = document.getElementById('ytPlayerFrame');
        const closePlayerBtn = document.getElementById('closePlayerBtn');

        // Converts a youtu.be / youtube.com / shorts link into an embeddable URL
        function getEmbedUrl(url) {
            try {
                let videoId = null;

                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('shorts/')) {
                    videoId = url.split('shorts/')[1].split('?')[0];
                } else if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1].split('&')[0];
                }

                return videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1` : null;
            } catch (e) {
                return null;
            }
        }

        function closePlayer() {
            playerWrapper.classList.remove('show');
            closePlayerBtn.classList.remove('show');
            ytPlayerFrame.src = '';
        }

        function updateDropdown(filterText) {
            dropdownList.innerHTML = '';
            const query = filterText.toLowerCase().trim();

            if (query === "") {
                dropdownList.style.display = 'none';
                return;
            }

            const filtered = cropData.filter(crop => crop.name.toLowerCase().includes(query));

            if (filtered.length > 0) {
                dropdownList.style.display = 'block';
                filtered.forEach(crop => {
                    const li = document.createElement('li');
                    li.textContent = crop.name;
                    li.addEventListener('click', () => {
                        searchInput.value = crop.name;
                        dropdownList.style.display = 'none';
                        
                        ytLinkBtn.href = crop.url;
                        ytLinkBtn.classList.add('active');
                        watchHereBtn.classList.add('active');
                        watchHereBtn.dataset.embedUrl = getEmbedUrl(crop.url) || '';
                        closePlayer();
                    });
                    dropdownList.appendChild(li);
                });
            } else {
                dropdownList.style.display = 'none';
            }
        }

        searchInput.addEventListener('input', (e) => {
            updateDropdown(e.target.value);
            ytLinkBtn.classList.remove('active');
            ytLinkBtn.href = "#";
            watchHereBtn.classList.remove('active');
            closePlayer();
        });

        watchHereBtn.addEventListener('click', () => {
            if (!watchHereBtn.classList.contains('active')) return;

            const embedUrl = watchHereBtn.dataset.embedUrl;
            if (!embedUrl) {
                alert("Sorry, this video can't be embedded. Please use 'Watch on YouTube' instead.");
                return;
            }

            ytPlayerFrame.src = embedUrl;
            playerWrapper.classList.add('show');
            closePlayerBtn.classList.add('show');
            playerWrapper.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        closePlayerBtn.addEventListener('click', closePlayer);

        // Go Back button: return to the previous page (e.g. the Dashboard)
        document.getElementById('goBackBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                dropdownList.style.display = 'none';
            }
        });
    </script>
