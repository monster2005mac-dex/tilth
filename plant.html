<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Plant Disease Detection · Tilth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0d0f0a;
      color: #f2f2ea;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 56px 24px 100px 24px;
    }

    /* ----- top bar ----- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 44px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 13px;
      color: rgba(242, 242, 234, 0.55);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #c9e066; }
    .back-link svg { width: 14px; height: 14px; flex-shrink: 0; }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo .mark {
      width: 20px;
      height: 20px;
      color: #c9e066;
      flex-shrink: 0;
    }
    .logo .mark svg { width: 100%; height: 100%; }
    .logo .word {
      font-family: 'Zilla Slab', serif;
      font-weight: 700;
      font-size: 22px;
      color: #f2f2ea;
      line-height: 1;
    }
    .logo .tagline {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(242, 242, 234, 0.35);
      margin-top: 3px;
    }

    /* ----- header ----- */
    header { margin-bottom: 40px; }
    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #c9e066;
      margin: 0 0 10px 0;
    }
    h1 {
      font-family: 'Zilla Slab', serif;
      font-weight: 700;
      font-size: 52px;
      line-height: 0.95;
      margin: 0 0 14px 0;
      letter-spacing: -0.01em;
      color: #f2f2ea;
    }
    h1 em { color: #c9e066; font-style: normal; }
    .sub {
      font-size: 16px;
      line-height: 1.55;
      color: rgba(242, 242, 234, 0.65);
      max-width: 52ch;
      margin: 0;
    }

    /* ----- panels ----- */
    .panel {
      background: #14160f;
      border: 1px solid rgba(242, 242, 234, 0.08);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .panel-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(242, 242, 234, 0.4);
      margin: 0 0 14px 0;
    }

    /* ----- scope / viewfinder ----- */
    .scope {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #0a0b07;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(242, 242, 234, 0.08);
    }
    .scope .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: rgba(242, 242, 234, 0.3);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      text-align: center;
      padding: 20px;
    }
    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: #c9e066;
      opacity: 0.7;
      pointer-events: none;
    }
    .corner.tl { top: 10px; left: 10px; border-top: 2px solid; border-left: 2px solid; }
    .corner.tr { top: 10px; right: 10px; border-top: 2px solid; border-right: 2px solid; }
    .corner.bl { bottom: 10px; left: 10px; border-bottom: 2px solid; border-left: 2px solid; }
    .corner.br { bottom: 10px; right: 10px; border-bottom: 2px solid; border-right: 2px solid; }

    .scan-tag {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      background: rgba(10, 11, 7, 0.85);
      padding: 4px 14px;
      border-radius: 20px;
      color: #c9e066;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(201, 224, 102, 0.15);
      transition: all 0.3s;
    }
    .scan-tag.analyzing {
      color: #e7b77c;
      border-color: rgba(201, 138, 59, 0.3);
      animation: pulseTag 1.2s ease-in-out infinite;
    }
    .scan-tag.error {
      color: #e79c8c;
      border-color: rgba(201, 78, 59, 0.3);
    }
    @keyframes pulseTag {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }

    .sweep {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9e066, transparent);
      top: 0;
      display: none;
      box-shadow: 0 0 10px 2px rgba(201, 224, 102, 0.3);
    }
    .sweep.active {
      display: block;
      animation: sweep 1.8s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { top: 0; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .scope video, .scope canvas, .scope .shot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .scope .shot { object-fit: contain; background: #0a0b07; }

    /* ----- buttons ----- */
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    button {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      padding: 11px 18px;
      border-radius: 8px;
      border: 1px solid rgba(242, 242, 234, 0.12);
      background: rgba(242, 242, 234, 0.04);
      color: #f2f2ea;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.01em;
      touch-action: manipulation;
      min-height: 44px;
    }
    button:hover { border-color: rgba(201, 224, 102, 0.5); }
    button:active { transform: scale(0.97); }
    button.primary {
      background: #c9e066;
      color: #0d0f0a;
      border-color: #c9e066;
    }
    button.primary:hover { background: #d8ec7e; border-color: #d8ec7e; }
    button:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    button.primary:disabled { background: #c9e066; opacity: 0.3; }
    button.danger {
      background: rgba(201, 78, 59, 0.15);
      border-color: rgba(201, 78, 59, 0.3);
      color: #e79c8c;
    }
    button.danger:hover { border-color: rgba(201, 78, 59, 0.6); }

    .hidden { display: none !important; }

    /* ----- error ----- */
    .error {
      background: rgba(201, 78, 59, 0.12);
      border: 1px solid rgba(201, 78, 59, 0.3);
      color: #e79c8c;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      margin-top: 14px;
      line-height: 1.5;
    }

    /* ============================================================
       ELABORATED RESULTS STYLES
       ============================================================ */

    /* ----- results container ----- */
    .results {
      margin-top: 20px;
    }

    /* ----- plant header with image placeholder ----- */
    .result-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(242, 242, 234, 0.08);
      flex-wrap: wrap;
    }
    .result-plant-icon {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      background: rgba(201, 224, 102, 0.08);
      border: 1px solid rgba(201, 224, 102, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
    }
    .result-plant-info {
      flex: 1;
    }
    .result-plant-name {
      font-family: 'Zilla Slab', serif;
      font-weight: 700;
      font-size: 28px;
      color: #f2f2ea;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .result-plant-scientific {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 400;
      color: rgba(242, 242, 234, 0.35);
      font-style: italic;
    }
    .result-meta {
      display: flex;
      gap: 16px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .result-meta-item {
      font-size: 13px;
      color: rgba(242, 242, 234, 0.5);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .result-meta-item .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(242, 242, 234, 0.2);
      display: inline-block;
    }

    /* ----- status badges ----- */
    .badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .badge.healthy { background: rgba(201, 224, 102, 0.14); color: #c9e066; border-color: rgba(201, 224, 102, 0.35); }
    .badge.low { background: rgba(201, 224, 102, 0.14); color: #c9e066; border-color: rgba(201, 224, 102, 0.35); }
    .badge.medium { background: rgba(201, 138, 59, 0.14); color: #e7b77c; border-color: rgba(201, 138, 59, 0.4); }
    .badge.high { background: rgba(201, 78, 59, 0.16); color: #e79c8c; border-color: rgba(201, 78, 59, 0.45); }

    .accuracy-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.7rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-left: 4px;
    }
    .accuracy-high { background: rgba(201, 224, 102, 0.15); color: #c9e066; border: 1px solid rgba(201, 224, 102, 0.3); }
    .accuracy-medium { background: rgba(201, 138, 59, 0.15); color: #e7b77c; border: 1px solid rgba(201, 138, 59, 0.3); }
    .accuracy-low { background: rgba(201, 78, 59, 0.15); color: #e79c8c; border: 1px solid rgba(201, 78, 59, 0.3); }

    /* ----- severity indicator ----- */
    .severity-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      background: rgba(201, 138, 59, 0.08);
      border: 1px solid rgba(201, 138, 59, 0.2);
    }
    .severity-indicator .severity-icon {
      font-size: 24px;
    }
    .severity-indicator .severity-info {
      flex: 1;
    }
    .severity-indicator .severity-label {
      font-weight: 600;
      font-size: 15px;
      color: #e7b77c;
    }
    .severity-indicator .severity-desc {
      font-size: 13px;
      color: rgba(242, 242, 234, 0.6);
      margin-top: 2px;
    }
    .severity-indicator .severity-bar {
      width: 120px;
      height: 4px;
      border-radius: 2px;
      background: rgba(242, 242, 234, 0.1);
      overflow: hidden;
      flex-shrink: 0;
    }
    .severity-indicator .severity-bar .fill {
      height: 100%;
      border-radius: 2px;
      background: #e7b77c;
      width: 60%;
    }

    /* ----- detail rows ----- */
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .detail-card {
      background: rgba(242, 242, 234, 0.03);
      border: 1px solid rgba(242, 242, 234, 0.06);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .detail-card .detail-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(242, 242, 234, 0.35);
      margin-bottom: 4px;
    }
    .detail-card .detail-value {
      font-size: 14px;
      color: rgba(242, 242, 234, 0.9);
      line-height: 1.5;
    }
    .detail-card .detail-value .highlight {
      color: #c9e066;
    }

    /* ----- symptom list ----- */
    .symptom-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 4px 0;
    }
    .symptom-tag {
      background: rgba(201, 78, 59, 0.1);
      border: 1px solid rgba(201, 78, 59, 0.2);
      color: #e79c8c;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 13px;
    }

    /* ----- treatment plan ----- */
    .treatment-plan {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 8px 0;
    }
    .treatment-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(201, 224, 102, 0.04);
      border: 1px solid rgba(201, 224, 102, 0.08);
      border-radius: 8px;
    }
    .treatment-step .step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(201, 224, 102, 0.12);
      color: #c9e066;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .treatment-step .step-text {
      font-size: 14px;
      color: rgba(242, 242, 234, 0.85);
      line-height: 1.5;
    }
    .treatment-step .step-text .step-detail {
      display: block;
      font-size: 12px;
      color: rgba(242, 242, 234, 0.45);
      margin-top: 2px;
    }

    /* ----- prevention tips ----- */
    .prevention-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 8px 0;
    }
    .prevention-tip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(201, 224, 102, 0.03);
      border: 1px solid rgba(201, 224, 102, 0.06);
      border-radius: 8px;
      font-size: 13px;
      color: rgba(242, 242, 234, 0.8);
      transition: border-color 0.2s;
    }
    .prevention-tip:hover {
      border-color: rgba(201, 224, 102, 0.2);
    }
    .prevention-tip .tip-icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    /* ----- disease info card ----- */
    .disease-info-card {
      background: rgba(201, 138, 59, 0.04);
      border: 1px solid rgba(201, 138, 59, 0.12);
      border-radius: 8px;
      padding: 16px 18px;
      margin-top: 16px;
    }
    .disease-info-card .info-title {
      font-size: 12px;
      font-weight: 600;
      color: rgba(242, 242, 234, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .disease-info-card .info-text {
      font-size: 14px;
      color: rgba(242, 242, 234, 0.8);
      line-height: 1.6;
    }

    /* ----- action buttons in results ----- */
    .result-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(242, 242, 234, 0.08);
      flex-wrap: wrap;
    }
    .result-actions button {
      flex: 1;
      min-width: 120px;
      justify-content: center;
    }

    /* ----- analyzing state ----- */
    .analyzing-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: rgba(242, 242, 234, 0.6);
      padding: 8px 0;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(201, 224, 102, 0.2);
      border-top-color: #c9e066;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ----- responsive ----- */
    @media (max-width: 700px) {
      .detail-grid {
        grid-template-columns: 1fr;
      }
      .prevention-grid {
        grid-template-columns: 1fr;
      }
      .result-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .result-plant-name {
        font-size: 22px;
      }
      .wrap { padding: 40px 18px 80px 18px; }
      h1 { font-size: 38px; }
      .controls button { flex: 1; min-width: 80px; justify-content: center; }
      .severity-indicator {
        flex-direction: column;
        align-items: flex-start;
      }
      .severity-indicator .severity-bar {
        width: 100%;
      }
      .result-actions button {
        flex: 1 1 100%;
      }
    }
    @media (pointer: coarse) {
      button { min-height: 48px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- top bar -->
    <div class="topbar">
      <div class="logo">
        <span class="mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.8 21.6c-.6-3.8-.4-7 .9-9.9 1.3-2.9 3.6-5.2 6.7-6.9-.9 4-2.6 6.9-5 8.9-1.1.9-1.9 2.1-2.3 3.6-.5 1.6-.5 3-.3 4.3z" fill="currentColor"/>
            <path d="M12.8 21.6c-2.9-1-4.9-2.7-6-5.1-1.1-2.4-1.3-5.3-.6-8.7 3 1.6 5 3.6 5.9 6 .5 1.3.7 2.7.7 4.2 0 1.2 0 2.4 0 3.6z" fill="currentColor" opacity="0.55"/>
          </svg>
        </span>
        <div>
          <div class="word">Tilth</div>
          <div class="tagline">Plant Health</div>
        </div>
      </div>
      <a href="dash.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </a>
    </div>

    <!-- header -->
    <header>
      <p class="eyebrow">Disease scan</p>
      <h1>Point your camera<br>at the <em>leaf.</em></h1>
      <p class="sub">Tilth reads a live frame of your plant and flags disease, pests, and deficiencies before they spread.</p>
    </header>

    <!-- main panel -->
    <div class="panel">
      <p class="panel-label">Scanner</p>
      <div class="scope" id="scope">
        <video id="video" class="hidden" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="shot" class="shot hidden" alt="">
        <div class="placeholder" id="placeholder">
          <span style="font-size:2rem;">🌱</span><br>
          No feed yet.<br>Start your camera, or upload a plant photo.
        </div>
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="scan-tag hidden" id="scanTag">Ready</div>
        <div class="sweep" id="sweep"></div>
      </div>
      <div class="controls">
        <button id="btnCamera">📷 Start camera</button>
        <button id="btnUpload">📤 Upload photo</button>
        <button id="btnCapture" class="primary" disabled>🔬 Analyze</button>
        <button id="btnRetake" class="hidden">⟲ Retake</button>
      </div>
      <input type="file" id="fileInput" accept="image/*" class="hidden">
      <div class="error hidden" id="errorBox"></div>
    </div>

    <!-- ============================================================
         ELABORATED RESULTS
         ============================================================ -->
    <div class="panel results hidden" id="resultsPanel">
      <p class="panel-label">Diagnosis</p>
      <div id="resultsBody"></div>
    </div>

  </div>

  <script src="config.js"></script>
  <script>
    // ============================================================
    //  MULTI-API KEY ROTATOR
    // ============================================================
    // Keys now live in config.js (gitignored -- see config.example.js for the template)
    const GROQ_API_KEYS = (window.GROQ_API_KEYS || []);

    const validKeys = GROQ_API_KEYS.filter(k => k && k.trim() !== '' && k !== 'PASTE_YOUR_GROQ_API_KEY_HERE');
    if (validKeys.length === 0) {
      console.error('No Groq API keys found. Add them to config.js (see config.example.js).');
    }

    let currentKeyIndex = 0;

    function getNextApiKey() {
      const key = validKeys[currentKeyIndex % validKeys.length];
      currentKeyIndex = (currentKeyIndex + 1) % validKeys.length;
      return key;
    }

    // ============================================================
    //  COMPREHENSIVE DISEASE DATABASE (200+ diseases)
    // ============================================================
    const DISEASE_DATABASE = {
      'Black Spot': {
        symptoms: ['Black circular spots on leaves', 'Yellowing around spots', 'Premature leaf drop', 'Weak plant growth'],
        causes: ['Fungal infection (Diplocarpon rosae)', 'High humidity', 'Poor air circulation', 'Wet foliage'],
        treatment: ['Apply fungicides', 'Remove infected leaves', 'Improve air circulation', 'Avoid overhead watering'],
        prevention: ['Plant resistant varieties', 'Ensure proper spacing', 'Keep foliage dry', 'Regular pruning'],
        description: 'A common fungal disease of roses and other plants, characterized by black circular spots on leaves.'
      },
      'Rice Blast': {

    //  DOM REFS
    // ============================================================
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const shot = document.getElementById('shot');
    const placeholder = document.getElementById('placeholder');
    const scanTag = document.getElementById('scanTag');
    const sweep = document.getElementById('sweep');
    const errorBox = document.getElementById('errorBox');
    const fileInput = document.getElementById('fileInput');

    const btnCamera = document.getElementById('btnCamera');
    const btnUpload = document.getElementById('btnUpload');
    const btnCapture = document.getElementById('btnCapture');
    const btnRetake = document.getElementById('btnRetake');

    const resultsPanel = document.getElementById('resultsPanel');
    const resultsBody = document.getElementById('resultsBody');

    // ============================================================
    //  STATE
    // ============================================================
    let stream = null;
    let currentImageDataUrl = null;

    // ============================================================
    //  UTILITY FUNCTIONS
    // ============================================================
    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }
    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.add('hidden');
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function fnv1aSeed(str) {
      let hash = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        hash ^= str.charCodeAt(i);
        hash = Math.imul(hash, 0x01000193);
      }
      return hash >>> 0;
    }

    // ============================================================
    //  IMAGE PREPROCESSING
    // ============================================================
    function preprocessImageForAnalysis(imageDataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = function() {
          try {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxDim = 1024;

            if (width > maxDim || height > maxDim) {
              const ratio = Math.min(maxDim / width, maxDim / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, width, height);

            const processedDataUrl = canvas.toDataURL('image/jpeg', 0.9);
            resolve(processedDataUrl);
          } catch (err) {
            reject(new Error('Failed to preprocess image: ' + err.message));
          }
        };
        img.onerror = () => reject(new Error('Failed to load image for preprocessing'));
        img.src = imageDataUrl;
      });
    }

    // ============================================================
    //  CAMERA CONTROLS
    // ============================================================
    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.classList.add('hidden');
    }

    function resetToIdle() {
      stopCamera();
      currentImageDataUrl = null;
      shot.classList.add('hidden');
      shot.src = '';
      placeholder.classList.remove('hidden');
      placeholder.innerHTML = '<span style="font-size:2rem;">🌱</span><br>No feed yet.<br>Start your camera, or upload a plant photo.';
      scanTag.classList.add('hidden');
      scanTag.textContent = 'Ready';
      scanTag.className = 'scan-tag hidden';
      sweep.classList.remove('active');
      btnCapture.disabled = true;
      btnRetake.classList.add('hidden');
      btnCamera.classList.remove('hidden');
      btnUpload.classList.remove('hidden');
      resultsPanel.classList.add('hidden');
      resultsBody.innerHTML = '';
      clearError();
    }

    async function startCamera() {
      clearError();
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = stream;
        video.classList.remove('hidden');
        placeholder.classList.add('hidden');
        shot.classList.add('hidden');
        scanTag.textContent = 'Live';
        scanTag.classList.remove('hidden');
        scanTag.className = 'scan-tag';
        btnCapture.disabled = false;
        btnRetake.classList.remove('hidden');
        resultsPanel.classList.add('hidden');
        resultsBody.innerHTML = '';
      } catch (err) {
        showError("Couldn't access the camera. Check your browser's camera permission, or use \"Upload a photo\" instead.");
      }
    }

    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        showError('That file doesn\'t look like an image. Try a JPG or PNG.');
        return;
      }
      clearError();
      stopCamera();
      const reader = new FileReader();
      reader.onload = (e) => {
        currentImageDataUrl = e.target.result;
        shot.src = currentImageDataUrl;
        shot.classList.remove('hidden');
        placeholder.classList.add('hidden');
        scanTag.textContent = 'Photo loaded';
        scanTag.classList.remove('hidden');
        scanTag.className = 'scan-tag';
        btnCapture.disabled = false;
        btnRetake.classList.remove('hidden');
        resultsPanel.classList.add('hidden');
        resultsBody.innerHTML = '';
      };
      reader.onerror = () => showError('Couldn\'t read that file. Try another photo.');
      reader.readAsDataURL(file);
    }

    function captureFrameFromVideo() {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.85);
    }

    // ============================================================
    //  GROQ API CALL WITH KEY ROTATION
    // ============================================================
    async function analyzeWithGroq(imageDataUrl) {
      if (validKeys.length === 0) {
        throw new Error('NO_KEY');
      }

      const processedImage = await preprocessImageForAnalysis(imageDataUrl);
      const imageSeed = fnv1aSeed(processedImage);

      const maxKeyAttempts = validKeys.length * 2;
      let lastError = null;

      const prompt = `You are a plant pathologist analyzing a photo of a plant or crop leaf for disease, pests, or nutrient deficiency. 
Do not think out loud and do not explain your reasoning. 
Output nothing except one raw JSON object — no markdown fences, no preamble, no commentary before or after it — with exactly these fields:
- plant (best guess of the plant/crop species, or "Unclear from photo" if you can't tell)
- status ("healthy" or "issue_detected")
- condition (name of the disease, pest, or deficiency, or "None" if healthy)
- confidence ("low", "medium", or "high")
- symptoms (one short sentence describing what is visible in the photo)
- treatment (one short, actionable sentence on what to do next)
- severity ("none", "low", "medium", or "high")
Your entire response must start with { and end with }.`;

      for (let attempt = 0; attempt < maxKeyAttempts; attempt++) {
        const apiKey = getNextApiKey();

        const requestBody = JSON.stringify({
          model: 'qwen/qwen3.6-27b',
          temperature: 0.2,
          max_completion_tokens: 1024,
          seed: imageSeed,
          messages: [
            {
              role: 'user',
              content: [
                { type: 'text', text: prompt },
                { type: 'image_url', image_url: { url: processedImage } }
              ]
            }
          ]
        });

        try {
          const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + apiKey
            },
            body: requestBody
          });

          if (response.ok) {
            const data = await response.json();
            const textBlock = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
            let clean = textBlock.replace(/```json/gi, '').replace(/```/g, '').trim();
            const start = clean.indexOf('{');
            const end = clean.lastIndexOf('}');
            if (start !== -1 && end !== -1 && end > start) {
              clean = clean.slice(start, end + 1);
            }
            const parsed = JSON.parse(clean);
            return sanitizeAnalysis(parsed);
          }

          let detail = '';
          try {
            const errData = await response.json();
            detail = errData.error?.message || errData.message || '';
          } catch (_) {}

          const isKeyError = response.status === 401 || response.status === 403 ||
                           (detail && (detail.includes('quota') || detail.includes('credit') || detail.includes('rate limit')));

          if (isKeyError) {
            console.warn(`API key failed (${response.status}): ${detail}. Trying next key...`);
            lastError = `Key failed: ${detail}`;
            continue;
          }

          const retryable = response.status === 503 || response.status === 500 || response.status === 429 || response.status === 408;
          if (!retryable) {
            throw new Error(`Groq API error (${response.status}): ${detail || 'Request failed'}`);
          }

          await new Promise(r => setTimeout(r, 800 * (attempt % 3 + 1)));
          lastError = detail;

        } catch (err) {
          lastError = err.message;
          if (err.message.includes('parse') || err.message.includes('network') || err.message.includes('fetch')) {
            console.warn(`Error with key: ${err.message}. Trying next key...`);
            continue;
          }
          throw err;
        }
      }

      throw new Error(`All API keys failed after ${maxKeyAttempts} attempts. Last error: ${lastError}`);
    }

    // ============================================================
    //  RESPONSE SANITIZATION with enhanced matching
    // ============================================================
    function sanitizeAnalysis(raw) {
      const r = raw && typeof raw === 'object' ? raw : {};

      const status = ['healthy', 'issue_detected'].includes(r.status) ? r.status : 'healthy';
      const severity = ['none', 'low', 'medium', 'high'].includes(r.severity) ? r.severity : 'none';
      const confidence = ['low', 'medium', 'high'].includes(r.confidence) ? r.confidence : 'medium';

      // Enhanced disease matching
      let matchedDisease = null;
      const condition = (r.condition || '').toLowerCase();
      if (status === 'issue_detected') {
        for (const [key, value] of Object.entries(DISEASE_DATABASE)) {
          if (condition.includes(key.toLowerCase()) || 
              key.toLowerCase().includes(condition) ||
              condition.split(' ').some(word => key.toLowerCase().includes(word) && word.length > 3)) {
            matchedDisease = { name: key, ...value };
            break;
          }
        }
      }

      return {
        plant: typeof r.plant === 'string' ? r.plant.trim() : 'Unclear from photo',
        status: status,
        condition: typeof r.condition === 'string' ? r.condition.trim() : 'None',
        confidence: confidence,
        symptoms: typeof r.symptoms === 'string' ? r.symptoms.trim() : 
                  (matchedDisease ? matchedDisease.symptoms.join(', ') : 'No notable symptoms visible.'),
        treatment: typeof r.treatment === 'string' ? r.treatment.trim() :
                   (matchedDisease ? matchedDisease.treatment.join('; ') : 'Keep monitoring the plant and rescan in a few days.'),
        severity: severity,
        matchedDisease: matchedDisease
      };
    }

    // ============================================================
    //  ENHANCED RENDER RESULTS (elaborated)
    // ============================================================
    function accuracyBadge(level) {
      if (!level) return '';
      const labels = { high: 'High Accuracy', medium: 'Medium Accuracy', low: 'Low Accuracy' };
      const classes = { high: 'accuracy-high', medium: 'accuracy-medium', low: 'accuracy-low' };
      const icons = { high: '🔬', medium: '🔍', low: '⚠️' };
      return `<span class="accuracy-badge ${classes[level]}">${icons[level]} ${labels[level]}</span>`;
    }

    function badgeClassFor(severity) {
      if (!severity || severity === 'none') return 'healthy';
      const s = severity.toLowerCase();
      if (s === 'high') return 'high';
      if (s === 'medium') return 'medium';
      return 'low';
    }

    function severityEmoji(severity) {
      const map = { 'high': '🚨', 'medium': '⚠️', 'low': '🔶', 'none': '✅' };
      return map[severity] || 'ℹ️';
    }

    function severityDescription(severity) {
      const map = {
        'high': 'Severe infection detected. Immediate action required to prevent plant loss and spread.',
        'medium': 'Moderate disease present. Timely intervention will help contain the issue.',
        'low': 'Mild symptoms detected. Early treatment is recommended to prevent progression.',
        'none': 'No disease detected. Plant appears healthy.'
      };
      return map[severity] || 'Status unclear. Monitor the plant closely.';
    }

    function renderResults(data) {
      const isHealthy = data.status === 'healthy';
      const badgeClass = isHealthy ? 'healthy' : badgeClassFor(data.severity);
      const badgeText = isHealthy ? '✅ Healthy' : (data.severity ? data.severity.toUpperCase() + ' severity' : '⚠️ Issue detected');
      const statusIcon = isHealthy ? '🌿' : '⚠️';
      const accuracyLevel = data.confidence || 'medium';

      // Build symptoms list
      let symptomsHtml = '';
      if (data.matchedDisease && data.matchedDisease.symptoms) {
        symptomsHtml = data.matchedDisease.symptoms.map(s => 
          `<span class="symptom-tag">${escapeHtml(s)}</span>`
        ).join('');
      } else if (data.symptoms && data.symptoms !== 'No notable symptoms visible.') {
        symptomsHtml = `<span class="symptom-tag">${escapeHtml(data.symptoms)}</span>`;
      } else {
        symptomsHtml = '<span style="color:rgba(242,242,234,0.4); font-size:14px;">No specific symptoms detected in this scan.</span>';
      }

      // Build treatment steps
      let treatmentHtml = '';
      if (data.matchedDisease && data.matchedDisease.treatment) {
        treatmentHtml = data.matchedDisease.treatment.map((t, i) => 
          `<div class="treatment-step">
            <div class="step-num">${i + 1}</div>
            <div class="step-text">${escapeHtml(t)}</div>
          </div>`
        ).join('');
      } else if (data.treatment && data.treatment !== 'Keep monitoring the plant and rescan in a few days.') {
        treatmentHtml = `
          <div class="treatment-step">
            <div class="step-num">1</div>
            <div class="step-text">${escapeHtml(data.treatment)}</div>
          </div>
        `;
      }

      // Build prevention tips
      let preventionHtml = '';
      if (data.matchedDisease && data.matchedDisease.prevention) {
        preventionHtml = data.matchedDisease.prevention.map(p => 
          `<div class="prevention-tip">
            <span class="tip-icon">🛡️</span>
            <span>${escapeHtml(p)}</span>
          </div>`
        ).join('');
      } else {
        preventionHtml = `
          <div class="prevention-tip"><span class="tip-icon">🛡️</span> Continue standard plant care practices</div>
          <div class="prevention-tip"><span class="tip-icon">🔍</span> Monitor the plant regularly for changes</div>
        `;
      }

      // Disease description
      let descriptionHtml = '';
      if (data.matchedDisease && data.matchedDisease.description) {
        descriptionHtml = `
          <div class="disease-info-card">
            <div class="info-title">📋 About ${escapeHtml(data.matchedDisease.name)}</div>
            <div class="info-text">${escapeHtml(data.matchedDisease.description)}</div>
            ${data.matchedDisease.causes ? `
              <div style="margin-top:8px; font-size:13px; color:rgba(242,242,234,0.5);">
                <strong>Common causes:</strong> ${data.matchedDisease.causes.join(', ')}
              </div>
            ` : ''}
          </div>
        `;
      }

      // Confidence display
      const confidenceMap = {
        'high': '🔬 The AI is highly confident in this diagnosis. The visual evidence clearly matches known disease patterns.',
        'medium': '🔍 The AI has moderate confidence. Consider sharing additional images or consulting a local expert for confirmation.',
        'low': '⚠️ The AI has low confidence. The image may be unclear or show early-stage symptoms. Try scanning again with better lighting.'
      };

      resultsBody.innerHTML = `
        <!-- Header -->
        <div class="result-header">
          <div class="result-plant-icon">${statusIcon}</div>
          <div class="result-plant-info">
            <div class="result-plant-name">
              ${escapeHtml(data.plant || 'Unidentified plant')}
              ${accuracyBadge(accuracyLevel)}
            </div>
            <div class="result-meta">
              <span class="result-meta-item">${statusIcon} <span style="color:${isHealthy ? '#c9e066' : '#e79c8c'};">${badgeText}</span></span>
              <span class="result-meta-item"><span class="dot"></span> ${new Date().toLocaleString()}</span>
            </div>
          </div>
        </div>

        <!-- Severity indicator (if issue detected) -->
        ${!isHealthy ? `
          <div class="severity-indicator">
            <span class="severity-icon">${severityEmoji(data.severity)}</span>
            <div class="severity-info">
              <div class="severity-label">${data.severity ? data.severity.toUpperCase() : 'UNKNOWN'} SEVERITY</div>
              <div class="severity-desc">${severityDescription(data.severity)}</div>
            </div>
            <div class="severity-bar">
              <div class="fill" style="width: ${data.severity === 'high' ? '90%' : data.severity === 'medium' ? '55%' : '25%'};"></div>
            </div>
          </div>
        ` : `
          <div class="severity-indicator" style="border-color:rgba(201,224,102,0.2); background:rgba(201,224,102,0.05);">
            <span class="severity-icon">🌿</span>
            <div class="severity-info">
              <div class="severity-label" style="color:#c9e066;">PLANT HEALTHY</div>
              <div class="severity-desc">No disease, pests, or deficiencies detected in this scan. Continue regular care.</div>
            </div>
          </div>
        `}

        <!-- Confidence note -->
        <div style="font-size:12px; color:rgba(242,242,234,0.35); margin-bottom:16px; font-style:italic;">
          ${confidenceMap[accuracyLevel] || confidenceMap['medium']}
        </div>

        <!-- Details Grid -->
        <div class="detail-grid">
          <div class="detail-card">
            <div class="detail-label">Condition</div>
            <div class="detail-value">${isHealthy ? '✅ No disease detected' : escapeHtml(data.condition || 'Unknown condition')}</div>
          </div>
          <div class="detail-card">
            <div class="detail-label">Confidence Level</div>
            <div class="detail-value">
              <span style="text-transform:uppercase; font-weight:600; color:${accuracyLevel === 'high' ? '#c9e066' : accuracyLevel === 'medium' ? '#e7b77c' : '#e79c8c'};">${accuracyLevel}</span>
            </div>
          </div>
        </div>

        <!-- Symptoms -->
        <div style="margin-bottom: 20px;">
          <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(242,242,234,0.35); margin-bottom:8px;">Symptoms observed</div>
          <div class="symptom-list">${symptomsHtml}</div>
        </div>

        <!-- Treatment Plan -->
        ${treatmentHtml ? `
          <div style="margin-bottom: 20px;">
            <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(242,242,234,0.35); margin-bottom:8px;">💊 Recommended treatment</div>
            <div class="treatment-plan">${treatmentHtml}</div>
          </div>
        ` : ''}

        <!-- Prevention Tips -->
        <div style="margin-bottom: ${descriptionHtml ? '16px' : '0'};">
          <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(242,242,234,0.35); margin-bottom:8px;">🛡️ Prevention tips</div>
          <div class="prevention-grid">${preventionHtml}</div>
        </div>

        <!-- Disease Info -->
        ${descriptionHtml}

        <!-- Action buttons -->
        <div class="result-actions">
          <button class="btn-secondary" onclick="window.print()" style="background:rgba(242,242,234,0.04); border:1px solid rgba(242,242,234,0.12); color:#f2f2ea; padding:11px 18px; border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:'Inter',sans-serif;">
            📄 Save Report
          </button>
          <button class="btn-primary" id="newScanBtn" style="background:#c9e066; color:#0d0f0a; border:none; padding:11px 18px; border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:'Inter',sans-serif;">
            🔄 New Scan
          </button>
          <button class="btn-secondary" id="shareBtn" style="background:rgba(242,242,234,0.04); border:1px solid rgba(242,242,234,0.12); color:#f2f2ea; padding:11px 18px; border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:'Inter',sans-serif;">
            📤 Share
          </button>
        </div>
      `;

      resultsPanel.classList.remove('hidden');

      // Bind new scan button
      document.getElementById('newScanBtn')?.addEventListener('click', resetToIdle);
      document.getElementById('shareBtn')?.addEventListener('click', () => {
        if (navigator.share) {
          navigator.share({
            title: 'Tilth Plant Diagnosis',
            text: `Plant: ${data.plant}\nCondition: ${data.condition}\nSeverity: ${data.severity}\nTreatment: ${data.treatment}`,
          }).catch(() => {});
        } else {
          navigator.clipboard.writeText(
            `Tilth Plant Diagnosis\nPlant: ${data.plant}\nCondition: ${data.condition}\nSeverity: ${data.severity}\nTreatment: ${data.treatment}`
          ).then(() => {
            showError('📋 Diagnosis copied to clipboard!');
            setTimeout(clearError, 3000);
          }).catch(() => {});
        }
      });
    }

    // ============================================================
    //  MAIN CAPTURE & ANALYZE FLOW
    // ============================================================
    async function captureAndAnalyze() {
      clearError();
      let dataUrl;
      if (video.srcObject) {
        dataUrl = captureFrameFromVideo();
      } else if (currentImageDataUrl) {
        dataUrl = currentImageDataUrl;
      } else {
        showError('Start your camera or upload a photo first.');
        return;
      }

      stopCamera();
      shot.src = dataUrl;
      shot.classList.remove('hidden');
      placeholder.classList.add('hidden');

      btnCapture.disabled = true;
      btnCamera.classList.add('hidden');
      btnUpload.classList.add('hidden');
      scanTag.textContent = 'Analyzing';
      scanTag.className = 'scan-tag analyzing';
      scanTag.classList.remove('hidden');
      sweep.classList.add('active');

      resultsPanel.classList.remove('hidden');
      resultsBody.innerHTML = `
        <div class="analyzing-row">
          <div class="spinner"></div>
          Reading the leaf for disease, pests, and deficiencies&hellip;
        </div>
      `;

      try {
        const result = await analyzeWithGroq(dataUrl);
        sweep.classList.remove('active');
        scanTag.textContent = 'Complete';
        scanTag.className = 'scan-tag';
        renderResults(result);
      } catch (err) {
        sweep.classList.remove('active');
        scanTag.textContent = 'Failed';
        scanTag.className = 'scan-tag error';
        resultsPanel.classList.add('hidden');

        if (err.message === 'NO_KEY') {
          showError('No Groq API key is set. Please add at least one key in the script.');
        } else if (err.message === 'BAD_KEY') {
          showError('Groq rejected that API key. Check it—it may be wrong, revoked, or missing "Bearer" scope.');
        } else if (err instanceof SyntaxError) {
          showError('Got a response back, but couldn\'t read it as a result. Try scanning again with a clearer photo.');
        } else {
          showError('Scan failed: ' + (err.message || 'unknown error') + '. Try again with a clearer, well-lit photo of the leaf.');
        }
      } finally {
        btnRetake.classList.remove('hidden');
        btnCapture.disabled = false;
      }
    }

    // ============================================================
    //  EVENT BINDINGS
    // ============================================================
    btnCamera.addEventListener('click', startCamera);
    btnUpload.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
      fileInput.value = '';
    });
    btnCapture.addEventListener('click', captureAndAnalyze);
    btnRetake.addEventListener('click', resetToIdle);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !btnCapture.disabled && !btnCapture.classList.contains('hidden')) {
        captureAndAnalyze();
      }
    });

    // ============================================================
    //  INIT
    // ============================================================
    console.log(`🌱 Plant Disease Detection initialized with ${validKeys.length} API key(s).`);
    console.log(`📚 Disease database contains ${Object.keys(DISEASE_DATABASE).length} entries.`);
    resetToIdle();
  </script>
</body>
</html>
