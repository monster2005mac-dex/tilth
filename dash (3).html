// ================= FILE / SCAN HANDLING =================
function handleFile(file, sourceView) {
  if (!file) return;
  const reader = new FileReader();
  reader.onloadend = () => {
    state.imagePreview = reader.result;
    state.error = null;
    renderView(sourceView === 'scan' ? 'scan' : 'home');
  };
  reader.readAsDataURL(file);
}

async function runScan(sourceView) {
  if (!state.imagePreview) {
    state.error = 'Please upload or capture a photo first.';
    renderView('scan');
    return;
  }
  
  state.scanning = true;
  state.error = null;
  state.analysisAccuracy = null;
  state.allCropSuggestions = [];
  renderView(sourceView === 'scan' ? 'scan' : 'home');

  try {
    const result = await analyzeWithGroq(state.imagePreview);
    
    let accuracyLevel = 'high';
    if (result.healthScore < 20 || result.moisture < 10) accuracyLevel = 'low';
    else if (result.healthScore < 40 || result.moisture < 30) accuracyLevel = 'medium';
    else if (result.nutrients.nitrogen.value < 10 && result.nutrients.phosphorus.value < 10) accuracyLevel = 'medium';
    
    state.analysis = result;
    state.analysisAccuracy = accuracyLevel;
    
    state.allCropSuggestions = generateAICropSuggestions(result, state.cropPreferences);
    
    if (result.disease.detected) {
      state.diseaseHistory.push({
        date: new Date().toISOString(),
        disease: result.disease.message,
        severity: result.disease.severity,
        image: state.imagePreview
      });
    }
    
    state.scanning = false;
    state.currentSubView = null;
    renderView('home');
    showToast('Scan completed successfully', 'success');
  } catch (err) {
    console.error(err);
    state.error = err.message || 'Failed to analyze image. Please try again with a clearer photo.';
    state.scanning = false;
    renderView('scan');
  }
}

// ================= TOAST =================
function ensureToastContainer() {
  let el = document.getElementById('toast-container');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast-container';
    el.style.cssText = 'position:fixed; top:1.25rem; right:1.25rem; z-index:9999; display:flex; flex-direction:column; gap:0.6rem; max-width:min(360px, calc(100vw - 2rem));';
    document.body.appendChild(el);
  }
  return el;
}
function showToast(message, type = 'success', duration = 3500) {
  const container = ensureToastContainer();
  const colors = {
    success: 'var(--primary)',
    error: 'var(--danger)',
    info: 'var(--text-muted)'
  };
  const icons = { success: 'check-circle', error: 'x-circle', info: 'info' };
  const toast = document.createElement('div');
  toast.style.cssText = `
    display:flex; align-items:center; gap:0.7rem;
    background:var(--bg-card); border:1px solid var(--border-color);
    border-left:3px solid ${colors[type] || colors.success};
    border-radius:8px; padding:0.85rem 1rem;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    color:var(--text-main); font-size:0.88rem;
    opacity:0; transform:translateX(16px);
    transition:opacity .25s ease, transform .25s ease;
  `;
  toast.innerHTML = `${svgIcon(icons[type] || icons.success, 18, colors[type] || colors.success)}<span style="flex:1;">${message}</span>`;
  const closeBtn = document.createElement('button');
  closeBtn.innerHTML = svgIcon('x', 14);
  closeBtn.style.cssText = 'background:none; border:none; color:var(--text-faint); display:flex; padding:0;';
  toast.appendChild(closeBtn);
  container.appendChild(toast);

  requestAnimationFrame(() => {
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(0)';
  });

  const remove = () => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(16px)';
    setTimeout(() => toast.remove(), 250);
  };
  closeBtn.onclick = remove;
  const timer = setTimeout(remove, duration);
  toast.onmouseenter = () => clearTimeout(timer);
}

// ================= WEATHER =================
function initWeather() {
  if ('geolocation' in navigator) {
    navigator.geolocation.getCurrentPosition((pos) => {
      const { latitude, longitude } = pos.coords;
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&hourly=relativehumidity_2m`)
        .then(res => res.json())
        .then(wData => {
          const temp = Math.round(wData.current_weather.temperature);
          const humidity = wData.hourly?.relativehumidity_2m?.[0] ?? 60;
          const condition = wData.current_weather.weathercode < 3 ? 'Clear Sky' : 'Rain Expected';
          document.getElementById('weather-temp').textContent = temp;
          document.getElementById('weather-humidity').textContent = humidity;
          document.getElementById('weather-condition').textContent = condition;
        })
        .catch(() => {});
    }, () => {});
  }
}
