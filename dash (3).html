<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Tilth — AI Soil & Crop Intelligence</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-dark: #14100c;
      --bg-panel: #191410;
      --bg-card: #1b1611;
      --bg-input: #0f0b08;
      --primary: #8fa93a;
      --primary-bright: #b7cf5e;
      --primary-dim: #5f7328;
      --text-main: #f3ede1;
      --text-muted: #8a8172;
      --text-faint: #5c574c;
      --border-color: #2a2419;
      --border-soft: rgba(243, 237, 225, 0.08);
      --sidebar-w: 250px;
      --danger: #c1614a;
      --success: #7cb342;
      --warning: #fdd835;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --disease-severe: #c62828;
      --disease-moderate: #e65100;
      --disease-mild: #f9a825;
      --disease-healthy: #43a047;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    html, body { 
      background-color: var(--bg-dark); 
      color: var(--text-main); 
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
    }
    body {
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse 900px 500px at 15% -10%, rgba(143,169,58,0.07), transparent 60%);
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3 { font-family: 'Fraunces', serif; font-weight: 600; letter-spacing: -0.01em; }

    .hidden { display: none !important; }

    .container { max-width: 1200px; margin: 0 auto; width: 100%; padding: 0 1rem; }
    .flex-center { display: flex; align-items: center; justify-content: center; }
    .subtitle { color: var(--text-muted); }
    .text-gradient {
      color: var(--primary-bright);
      font-style: italic;
    }
    .eyebrow {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }
    .eyebrow::before {
      content: '';
      width: 14px;
      height: 1px;
      background: var(--primary);
      display: inline-block;
    }
    .glass-bg { background: rgba(143, 169, 58, 0.05); }
    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.5rem;
    }
    .glass-input, .search-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.8rem 1rem;
      color: var(--text-main);
      outline: none;
      font-size: 0.92rem;
      transition: border-color .15s;
      -webkit-appearance: none;
      appearance: none;
    }
    .glass-input:focus, .search-input:focus { border-color: var(--primary); }
    .field-label {
      display: block;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 0.5rem;
    }

    .btn-icon {
      width: 42px; height: 42px;
      min-width: 42px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-icon:active { transform: scale(0.95); }
    .btn-secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: border-color .2s, color .2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary-bright); }
    .btn-secondary:active { transform: scale(0.97); }
    .btn-secondary:disabled, .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .app-layout { display: flex; min-height: 100vh; position: relative; }
    .app-layout::before {
      content: '';
      position: fixed; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(143,169,58,0.5), transparent);
      z-index: 30;
    }
    .sidebar {
      width: var(--sidebar-w);
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1.75rem 1.1rem;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      overflow-y: auto;
      z-index: 20;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overscroll-behavior: contain;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    .main-content { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      overflow-y: auto; 
      margin-left: var(--sidebar-w); 
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }
    .topbar {
      height: 72px;
      min-height: 72px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      background-color: var(--bg-panel);
      flex-shrink: 0;
      position: sticky; top: 0; z-index: 10;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .dashboard-grid {
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }
    .view-page { 
      padding: 1.5rem; 
      display: flex; 
      flex-direction: column; 
      gap: 1.5rem; 
    }

    .panel {
      background-color: var(--bg-card); 
      border: 1px solid var(--border-color); 
      border-radius: 10px; 
      padding: 1.25rem;
      transition: border-color .2s ease, box-shadow .25s ease;
      box-shadow: 0 1px 0 rgba(243,237,225,0.02) inset, 0 10px 30px -18px rgba(0,0,0,0.6);
    }
    .panel:hover { border-color: rgba(243, 237, 225, 0.15); box-shadow: 0 1px 0 rgba(243,237,225,0.03) inset, 0 14px 34px -16px rgba(0,0,0,0.7); }

    .nav-item {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.7rem 0.9rem; border-radius: 6px;
      color: var(--text-muted); text-decoration: none;
      font-size: 0.88rem; font-weight: 500;
      transition: all 0.15s; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-item:hover { background-color: rgba(143, 169, 58, 0.08); color: var(--text-main); }
    .nav-item:active { transform: scale(0.97); }
    .nav-item.active { background-color: rgba(143, 169, 58, 0.12); color: var(--primary-bright); border-left: 2px solid var(--primary); padding-left: calc(0.9rem - 2px); }

    .nav-sub-item {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.5rem 0.9rem 0.5rem 2.5rem; border-radius: 6px;
      color: var(--text-faint); text-decoration: none;
      font-size: 0.82rem; font-weight: 400;
      transition: all 0.15s; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-sub-item:hover { background-color: rgba(143, 169, 58, 0.08); color: var(--text-main); }
    .nav-sub-item:active { transform: scale(0.97); }
    .nav-sub-item.active { background-color: rgba(143, 169, 58, 0.12); color: var(--primary-bright); border-left: 2px solid var(--primary); padding-left: calc(2.5rem - 2px); }

    .nav-external {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.7rem 0.9rem; border-radius: 6px;
      color: var(--text-muted); text-decoration: none;
      font-size: 0.88rem; font-weight: 500;
      transition: all 0.15s; cursor: pointer;
      background: transparent; width: 100%; text-align: left;
      border: none;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-external:hover { background-color: rgba(143, 169, 58, 0.08); color: var(--text-main); }
    .nav-external:active { transform: scale(0.97); }
    .nav-external.active { background-color: rgba(143, 169, 58, 0.12); color: var(--primary-bright); border-left: 2px solid var(--primary); padding-left: calc(0.9rem - 2px); }

    .sidebar-divider {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 0.8rem 0;
    }

    .circle-progress { position: relative; width: 140px; height: 140px; margin: 0 auto; }
    .circle-svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
    .circle-bg { fill: none; stroke: var(--border-color); stroke-width: 8; }
    .circle-fg { fill: none; stroke: var(--primary); stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray 1s ease; }
    .circle-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }

    .progress-bar-bg { width: 100%; height: 5px; background-color: var(--border-color); border-radius: 3px; margin-top: 0.5rem; overflow: hidden; }
    .progress-bar-fg { height: 100%; background-color: var(--primary); border-radius: 3px; transition: width .6s ease; }

    .badge { padding: 0.22rem 0.55rem; border-radius: 4px; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
    .badge-primary { background-color: rgba(143, 169, 58, 0.12); color: var(--primary-bright); border: 1px solid rgba(143, 169, 58, 0.25); }
    .badge-danger { background-color: rgba(193, 97, 74, 0.12); color: var(--danger); border: 1px solid rgba(193, 97, 74, 0.3); }
    .badge-success { background-color: rgba(143, 169, 58, 0.2); color: var(--primary-bright); border: 1px solid rgba(143, 169, 58, 0.3); }
    .badge-warning { background-color: rgba(253, 216, 53, 0.15); color: var(--warning); border: 1px solid rgba(253, 216, 53, 0.3); }
    .badge-excellent { background-color: rgba(143, 169, 58, 0.3); color: #fff; border: 1px solid var(--primary-bright); }
    .badge-disease-severe { background-color: rgba(198, 40, 40, 0.2); color: var(--disease-severe); border: 1px solid var(--disease-severe); }
    .badge-disease-moderate { background-color: rgba(230, 81, 0, 0.2); color: var(--disease-moderate); border: 1px solid var(--disease-moderate); }
    .badge-disease-mild { background-color: rgba(249, 168, 37, 0.2); color: var(--disease-mild); border: 1px solid var(--disease-mild); }
    .badge-disease-healthy { background-color: rgba(67, 160, 71, 0.2); color: var(--disease-healthy); border: 1px solid var(--disease-healthy); }

    .crop-card { 
      transition: border-color .2s ease, background-color .2s ease; 
      cursor: pointer;
    }
    .crop-card:hover { border-color: rgba(143, 169, 58, 0.35); background-color: rgba(143, 169, 58, 0.05); }
    .crop-card:active { transform: scale(0.98); }

    .btn-primary {
      background-color: var(--primary); color: #100d09; border: none;
      padding: 0.8rem 1.5rem; border-radius: 6px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.85rem;
      cursor: pointer; transition: all 0.2s;
      width: 100%;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn-primary:hover { background-color: var(--primary-bright); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-danger {
      background-color: var(--danger); color: #fff; border: none;
      padding: 0.4rem 1rem; border-radius: 6px; font-weight: 600;
      font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-danger:hover { opacity: 0.8; }
    .btn-danger:active { transform: scale(0.95); }

    .search-input {
      border-radius: 6px; padding: 0.6rem 1rem 0.6rem 2.5rem;
      width: 300px;
    }

    .icon-wrap svg { display: block; }

    .mobile-header { display: none; }

    @media (max-width: 1024px) {
      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        padding: 1rem;
      }
      .dashboard-grid > div {
        grid-column: 1 / -1 !important;
      }
      .dashboard-grid > div:first-child {
        grid-column: 1 / -1 !important;
      }
    }

    @media (max-width: 900px) {
      .app-layout {
        flex-direction: column;
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        width: 280px;
        height: 100vh;
        height: -webkit-fill-available;
        padding: 1.25rem;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: none;
      }
      .sidebar.mobile-open {
        transform: translateX(0);
        box-shadow: 4px 0 30px rgba(0,0,0,0.6);
      }
      
      .main-content {
        margin-left: 0;
        width: 100%;
      }
      
      .mobile-header {
        display: flex !important;
        padding: 0.75rem 1rem;
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border-color);
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 15;
        min-height: 60px;
      }
      
      .topbar {
        height: auto;
        min-height: 60px;
        padding: 0.75rem 1rem;
        gap: 0.5rem;
      }
      
      .dashboard-grid {
        grid-template-columns: 1fr;
        padding: 1rem;
        gap: 1rem;
      }
      
      .dashboard-grid > div {
        grid-column: 1 / -1 !important;
        grid-row: auto !important;
      }
      
      .view-page {
        padding: 1rem;
        gap: 1rem;
      }
      
      .search-input {
        width: 140px;
      }
      
      .panel {
        padding: 1rem;
      }
      
      .btn-primary, .btn-secondary {
        padding: 0.7rem 1.2rem;
        font-size: 0.8rem;
        min-height: 44px;
      }
      
      .btn-icon {
        width: 48px;
        height: 48px;
        min-width: 48px;
      }
      
      .glass-input, .search-input {
        padding: 0.7rem 0.9rem;
        font-size: 0.9rem;
        min-height: 44px;
      }
      
      .crop-detail-card {
        padding: 0.8rem;
      }
      
      .crop-detail-card .crop-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.3rem;
      }
      
      .crop-detail-card .crop-score {
        font-size: 1.2rem;
      }
      
      .crop-detail-card .crop-details {
        grid-template-columns: 1fr 1fr;
        gap: 0.3rem;
      }
      
      .crop-preference-item {
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
      }
      
      .crop-preference-item .crop-actions {
        justify-content: flex-end;
      }
      
      .input-group {
        flex-direction: column;
        gap: 0.5rem;
      }
      
      .input-group .btn-primary {
        width: 100%;
      }
      
      .circle-progress {
        width: 110px;
        height: 110px;
      }
      
      .circle-svg {
        width: 110px;
        height: 110px;
      }
      
      .circle-text div:first-child {
        font-size: 1.6rem !important;
      }
      
      #scan-dropzone {
        min-height: 200px;
        padding: 1rem !important;
      }
      
      #scan-camera-video {
        max-width: 100% !important;
      }
    }

    @media (max-width: 480px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
      }
      
      .topbar > div {
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      
      .topbar .weather-info {
        font-size: 0.75rem;
      }
      
      .dashboard-grid {
        padding: 0.75rem;
        gap: 0.75rem;
      }
      
      .view-page {
        padding: 0.75rem;
        gap: 0.75rem;
      }
      
      .panel {
        padding: 0.75rem;
      }
      
      h1 {
        font-size: 1.5rem !important;
      }
      
      h2 {
        font-size: 1.3rem !important;
      }
      
      h3 {
        font-size: 0.95rem !important;
      }
      
      .eyebrow {
        font-size: 0.6rem;
      }
      
      .crop-detail-card .crop-details {
        grid-template-columns: 1fr;
      }
      
      .crop-detail-card .crop-header {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .btn-secondary, .btn-primary {
        width: 100%;
        justify-content: center;
      }
      
      .btn-secondary[style*="width:auto"],
      .btn-primary[style*="width:auto"] {
        width: 100%;
      }
      
      .circle-progress {
        width: 90px;
        height: 90px;
      }
      
      .circle-svg {
        width: 90px;
        height: 90px;
      }
      
      .circle-text div:first-child {
        font-size: 1.2rem !important;
      }
      
      .sidebar {
        width: 260px;
        padding: 1rem;
      }
      
      .input-group {
        flex-direction: column;
      }
      
      .scan-sub-section .section-title {
        font-size: 0.8rem;
      }
      
      .badge {
        font-size: 0.6rem;
        padding: 0.15rem 0.4rem;
      }
      
      .crop-preference-item .crop-name {
        font-size: 0.8rem;
      }
      
      .dashboard-grid > div:last-child .panel {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      
      .crop-detail-card .crop-reason {
        font-size: 0.75rem;
      }
      
      .mobile-header .btn-icon {
        width: 44px;
        height: 44px;
        min-width: 44px;
      }
      
      #avatar-btn {
        width: 32px !important;
        height: 32px !important;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .sidebar {
        padding: 0.75rem;
      }
      .sidebar > div:first-child {
        padding-bottom: 0.75rem !important;
      }
      .sidebar > div:first-child div {
        font-size: 0.9rem !important;
      }
      .nav-item {
        padding: 0.4rem 0.6rem;
        font-size: 0.8rem;
      }
      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
      }
      .dashboard-grid > div {
        grid-column: auto !important;
      }
      .view-page {
        padding: 0.75rem;
      }
      .panel {
        padding: 0.75rem;
      }
      .circle-progress {
        width: 80px;
        height: 80px;
      }
      .circle-svg {
        width: 80px;
        height: 80px;
      }
    }

    @media (hover: none) {
      .panel:hover {
        border-color: var(--border-color) !important;
        box-shadow: 0 1px 0 rgba(243,237,225,0.02) inset, 0 10px 30px -18px rgba(0,0,0,0.6) !important;
      }
      .crop-card:hover {
        border-color: var(--border-color) !important;
        background-color: transparent !important;
      }
      .nav-item:hover {
        background-color: transparent !important;
        color: var(--text-muted) !important;
      }
      .btn-secondary:hover {
        border-color: var(--border-color) !important;
        color: var(--text-main) !important;
      }
    }

    @supports (padding: max(0px)) {
      .sidebar {
        padding-left: max(1.1rem, env(safe-area-inset-left));
        padding-right: max(1.1rem, env(safe-area-inset-right));
        padding-bottom: max(1.75rem, env(safe-area-inset-bottom));
      }
      .mobile-header {
        padding-left: max(1rem, env(safe-area-inset-left));
        padding-right: max(1rem, env(safe-area-inset-right));
      }
      .topbar {
        padding-left: max(1.5rem, env(safe-area-inset-left));
        padding-right: max(1.5rem, env(safe-area-inset-right));
      }
      .view-page {
        padding-left: max(1.5rem, env(safe-area-inset-left));
        padding-right: max(1.5rem, env(safe-area-inset-right));
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      }
      .dashboard-grid {
        padding-left: max(1.5rem, env(safe-area-inset-left));
        padding-right: max(1.5rem, env(safe-area-inset-right));
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      }
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; }

    .toggle { width: 42px; height: 23px; border-radius: 12px; position: relative; cursor: pointer; border: 1px solid var(--border-color); transition: .3s; }
    .toggle-knob { width: 17px; height: 17px; border-radius: 50%; position: absolute; top: 2px; transition: .3s; }

    @keyframes scanSweep {
      0% { top: 0%; opacity: 0; }
      8% { opacity: 1; }
      92% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
    @keyframes scanPulseBorder {
      0%, 100% { box-shadow: 0 0 0 1px var(--primary-bright), 0 0 14px 2px rgba(183,207,94,0.35); }
      50% { box-shadow: 0 0 0 1px var(--primary-bright), 0 0 26px 6px rgba(183,207,94,0.6); }
    }
    @keyframes scanGridFade {

function getTimeGreeting() {

  if (hour < 17) return 'Good Afternoon';
  return 'Good Evening';
}

function getDisplayName(username) {
  if (!username) return username;
  if (username.length > 10 && username.includes('_')) {
    return username.split('_')[0];
  }
  return username;
}

function svgIcon(name, size=20, color='currentColor', extraStyle='') {
  const body = ICONS[name] || '';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="${extraStyle}">${body}</svg>`;
}
function placeIcon(elId, name, size=20, color='currentColor') {
  const el = document.getElementById(elId);
  if (el) el.innerHTML = svgIcon(name, size, color);
}

/* ================= ACCURATE CROP SCORING ENGINE ================= */
function calculateCropScore(cropName, soilAnalysis) {
  const crop = CROP_DATABASE[cropName];
  if (!crop) return { score: 50, details: [] };
  
  const details = [];
  let totalScore = 50;
  
  const soilType = soilAnalysis.analysisDetails.soilType.toLowerCase();
  let soilScore = 0;
  if (soilType.includes('clay')) soilScore = crop.soilTypes.clay || 0;
  else if (soilType.includes('sandy')) soilScore = crop.soilTypes.sandy || 0;
  else soilScore = crop.soilTypes.loam || 0;
  totalScore += soilScore * 0.25;
  details.push({ factor: 'Soil Type', score: Math.round(soilScore * 0.25), max: 25 });
  
  const moisture = soilAnalysis.moisture;
  let moistureScore = 0;
  if (moisture >= crop.moistureRange.min && moisture <= crop.moistureRange.max) {
    const optimalDist = Math.abs(moisture - crop.moistureRange.optimal);
    const range = crop.moistureRange.max - crop.moistureRange.min;
    if (range > 0) {
      moistureScore = 20 * (1 - (optimalDist / (range / 2)));
      moistureScore = Math.max(0, Math.min(20, moistureScore));
    } else {
      moistureScore = 20;
    }
  } else if (moisture < crop.moistureRange.min) {
    moistureScore = -5 * ((crop.moistureRange.min - moisture) / 10);
  } else {
    moistureScore = -5 * ((moisture - crop.moistureRange.max) / 10);
  }
  moistureScore = Math.max(-10, Math.min(20, moistureScore));
  totalScore += moistureScore;
  details.push({ factor: 'Moisture', score: Math.round(moistureScore), max: 20 });
  
  const ph = soilAnalysis.nutrients.ph.value;
  let phScore = 0;
  if (ph >= crop.phRange.min && ph <= crop.phRange.max) {
    const optimalDist = Math.abs(ph - crop.phRange.optimal);
    const range = crop.phRange.max - crop.phRange.min;
    if (range > 0) {
      phScore = 15 * (1 - (optimalDist / (range / 2)));
      phScore = Math.max(0, Math.min(15, phScore));
    } else {
      phScore = 15;
    }
  } else if (ph < crop.phRange.min) {
    phScore = -3 * ((crop.phRange.min - ph) / 1);
  } else {
    phScore = -3 * ((ph - crop.phRange.max) / 1);
  }
  phScore = Math.max(-10, Math.min(15, phScore));
  totalScore += phScore;
  details.push({ factor: 'pH Level', score: Math.round(phScore), max: 15 });
  
  const n = soilAnalysis.nutrients.nitrogen.value;
  const p = soilAnalysis.nutrients.phosphorus.value;
  const k = soilAnalysis.nutrients.potassium.value;
  
  const nRatio = Math.min(1, n / crop.nutrientDemand.nitrogen);
  const pRatio = Math.min(1, p / crop.nutrientDemand.phosphorus);
  const kRatio = Math.min(1, k / crop.nutrientDemand.potassium);
  const avgNutrientRatio = (nRatio + pRatio + kRatio) / 3;
  
  let nutrientScore = 20 * avgNutrientRatio;
  nutrientScore = Math.max(-5, Math.min(20, nutrientScore));
  totalScore += nutrientScore;
  details.push({ factor: 'Nutrients', score: Math.round(nutrientScore), max: 20 });
  
  let tempScore = 8;
  details.push({ factor: 'Climate', score: tempScore, max: 10 });
  totalScore += tempScore;
  
  let diseaseScore = 0;
  if (soilAnalysis.disease && soilAnalysis.disease.detected) {
    const severityMap = { 'Severe': -10, 'Moderate': -7, 'Mild': -4, 'None': 0 };
    diseaseScore = severityMap[soilAnalysis.disease.severity] || -5;
  } else {
    diseaseScore = 8;
  }
  totalScore += diseaseScore;
  details.push({ factor: 'Disease Risk', score: diseaseScore, max: 10 });
  
  totalScore = Math.max(0, Math.min(100, Math.round(totalScore)));
  
  return {
    score: totalScore,
    details: details,
    cropInfo: crop
  };
}

function getDetailedCropSuggestions(soilAnalysis, preferences = []) {
  const results = [];
  const cropNames = Object.keys(CROP_DATABASE);
  
  cropNames.forEach(cropName => {
    const result = calculateCropScore(cropName, soilAnalysis);
    const isPreferred = preferences.includes(cropName);
    const prefIndex = isPreferred ? preferences.indexOf(cropName) : -1;
    
    // Apply preference boost based on priority
    let score = result.score;
    if (isPreferred) {
      const boost = Math.max(3, 12 - prefIndex * 1.5);
      score = Math.min(100, score + boost);
    }
    
    results.push({
      name: cropName,
      score: Math.round(score),
      details: result.details,
      cropInfo: result.cropInfo,
      isPreferred: isPreferred,
      preferenceRank: isPreferred ? prefIndex + 1 : null,
      baseScore: result.score
    });
  });
  
  results.sort((a, b) => b.score - a.score);
  
  results.forEach((c, i) => {
    c.rank = i + 1;
    if (i === 0) c.rankLabel = '🏆 Best Match';
    else if (i < 3) c.rankLabel = '⭐ Excellent';
    else if (i < 5) c.rankLabel = '✅ Good';
    else if (i < 8) c.rankLabel = '👍 Fair';
    else c.rankLabel = '📋 Consider';
  });
  
  return results;
}

function generateAICropSuggestions(soilAnalysis, preferences = []) {
  const dbResults = getDetailedCropSuggestions(soilAnalysis, preferences);
  const aiSuggestions = soilAnalysis.cropSuggestions || [];
  
  const mergedResults = dbResults.map(dbCrop => {
    const isPreferred = preferences.includes(dbCrop.name);
    const prefIndex = isPreferred ? preferences.indexOf(dbCrop.name) : -1;
    
    const aiMatch = aiSuggestions.find(ai => 
      ai.name.toLowerCase() === dbCrop.name.toLowerCase()
    );
    
    let result = {
      ...dbCrop,
      isPreferred: isPreferred,
      preferenceRank: isPreferred ? prefIndex + 1 : null,
    };
    
    if (aiMatch) {
      const avgScore = Math.round((dbCrop.score + aiMatch.score) / 2);
      const boost = isPreferred ? Math.max(3, 10 - prefIndex * 1.5) : 0;
      result.score = Math.min(100, avgScore + boost);
      result.aiReason = aiMatch.reason || dbCrop.cropInfo?.description || '';
      result.aiGenerated = true;
      result.aiEquipment = aiMatch.equipment || dbCrop.cropInfo?.equipment || [];
      result.aiGrowingSeason = aiMatch.growingSeason || `${dbCrop.cropInfo?.growingSeason || 120} days`;
      result.aiWaterRequirement = aiMatch.waterRequirement || dbCrop.cropInfo?.waterRequirement || 'Moderate';
    } else {
      const boost = isPreferred ? Math.max(2, 8 - prefIndex * 1.5) : 0;
      result.score = Math.min(100, dbCrop.score + boost);
      result.aiGenerated = false;
      result.aiReason = dbCrop.cropInfo?.description || '';
      result.aiEquipment = dbCrop.cropInfo?.equipment || [];
      result.aiGrowingSeason = `${dbCrop.cropInfo?.growingSeason || 120} days`;
      result.aiWaterRequirement = dbCrop.cropInfo?.waterRequirement || 'Moderate';
    }
    
    return result;
  });
  
  mergedResults.sort((a, b) => b.score - a.score);
  
  mergedResults.forEach((c, i) => {
    c.rank = i + 1;
    if (i === 0) c.rankLabel = '🏆 Best Match';
    else if (i < 3) c.rankLabel = '⭐ Excellent';
    else if (i < 5) c.rankLabel = '✅ Good';
    else if (i < 8) c.rankLabel = '👍 Fair';
    else c.rankLabel = '📋 Consider';
  });
  
  return mergedResults;
}

/* ================= GROQ API FUNCTIONS ================= */
function clampNum(val, min, max, fallback) {
  const n = typeof val === 'number' ? val : parseFloat(val);
  if (!Number.isFinite(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}
function cleanStr(val, fallback) {
  return (typeof val === 'string' && val.trim()) ? val.trim() : fallback;
}
function cleanEquipment(list) {
  const arr = Array.isArray(list) ? list.filter(x => typeof x === 'string' && x.trim()) : [];
  return arr.length ? arr.slice(0, 3) : ['General Purpose Tools'];
}

function sanitizeCrop(raw, index) {
  return {
    name: cleanStr(raw?.name, `Crop ${index + 1}`),
    score: Math.round(clampNum(raw?.score, 0, 100, 70 - index * 5)),
    reason: cleanStr(raw?.reason, 'Suitable for your soil conditions.'),
    growingSeason: cleanStr(raw?.growingSeason, `${120 - index * 10} days`),
    waterRequirement: cleanStr(raw?.waterRequirement, index < 2 ? 'High' : index < 4 ? 'Moderate' : 'Low'),
    equipment: cleanEquipment(raw?.equipment)
  };
}

function sanitizeAnalysis(raw) {
  const r = raw && typeof raw === 'object' ? raw : {};
  const n = r.nutrients && typeof r.nutrients === 'object' ? r.nutrients : {};
  const sanitizeNutrient = (obj, min, max, mid, statuses) => ({
    value: Math.round(clampNum(obj?.value, min, max, mid)),
    status: statuses.includes(obj?.status) ? obj.status : statuses[1],
  });

  const recs = Array.isArray(r.recommendations) ? r.recommendations.filter(x => typeof x === 'string' && x.trim()) : [];
  while (recs.length < 4) {
    recs.push(['Retest soil after your next irrigation cycle for the most accurate readings.',
      'Add organic compost to improve long-term soil structure.',
      'Rotate crops seasonally to reduce nutrient depletion.',
      'Monitor for pest activity weekly during the growing season.'][recs.length] || 'Continue monitoring soil conditions regularly.');
  }

  const aiCrops = Array.isArray(r.cropSuggestions) ? r.cropSuggestions : [];
  const cropSuggestions = aiCrops.map((crop, i) => sanitizeCrop(crop, i));

  const disease = r.disease || {};
  const severityMap = { 'Severe': 'Severe', 'Moderate': 'Moderate', 'Mild': 'Mild', 'None': 'None' };
  const severity = severityMap[disease.severity] || (disease.detected ? 'Moderate' : 'None');
  
  let matchedDisease = null;
  if (disease.detected) {
    const diseaseName = disease.message || '';
    for (const [key, value] of Object.entries(DISEASE_DATABASE)) {
      if (diseaseName.toLowerCase().includes(key.toLowerCase()) || 
          key.toLowerCase().includes(diseaseName.toLowerCase())) {
        matchedDisease = { name: key, ...value };
        break;
      }
    }
  }

  return {
    healthScore: Math.round(clampNum(r.healthScore, 0, 100, 70)),
    moisture: Math.round(clampNum(r.moisture, 0, 100, 50)),
    nutrients: {
      nitrogen: sanitizeNutrient(n.nitrogen, 0, 100, 50, ['Low', 'Adequate', 'Optimal']),
      phosphorus: sanitizeNutrient(n.phosphorus, 0, 100, 50, ['Low', 'Adequate', 'Optimal']),
      potassium: sanitizeNutrient(n.potassium, 0, 100, 50, ['Low', 'Adequate', 'Optimal']),
      ph: sanitizeNutrient(n.ph, 0, 14, 6.5, ['Acidic', 'Balanced', 'Alkaline']),
    },
    analysisDetails: {
      soilType: cleanStr(r.analysisDetails?.soilType, 'Loamy Soil'),
      moistureRaw: cleanStr(r.analysisDetails?.moistureRaw, 'Estimate unavailable'),
      organicMatter: cleanStr(r.analysisDetails?.organicMatter, 'Estimate unavailable'),
    },
    disease: {
      detected: typeof disease.detected === 'boolean' ? disease.detected : false,
      message: cleanStr(disease.message, 'No Disease Detected'),
      subtext: cleanStr(disease.subtext, 'No visible signs of disease or pest damage were detected.'),
      severity: severity,
      symptoms: Array.isArray(disease.symptoms) ? disease.symptoms.slice(0, 4) : 
                (matchedDisease ? matchedDisease.symptoms : ['No visible symptoms']),
      treatment: Array.isArray(disease.treatment) ? disease.treatment.slice(0, 4) :
                 (matchedDisease ? matchedDisease.treatment : ['No treatment needed']),
      prevention: Array.isArray(disease.prevention) ? disease.prevention.slice(0, 4) :
                  (matchedDisease ? matchedDisease.prevention : ['Continue standard practices']),
      matchedDisease: matchedDisease
    },
    recommendations: recs.slice(0, 4),
    cropSuggestions: cropSuggestions,
  };
}

function fnv1aSeed(str) {
  let hash = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    hash ^= str.charCodeAt(i);
    hash = Math.imul(hash, 0x01000193);
  }
  return hash >>> 0;
}

function preprocessImageForAnalysis(imageDataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = function() {
      try {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxDim = 1024;
        
        if (width > maxDim || height > maxDim) {
          const ratio = Math.min(maxDim / width, maxDim / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }
        
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, width, height);
        
        const processedDataUrl = canvas.toDataURL('image/jpeg', 0.9);
        resolve(processedDataUrl);
      } catch (err) {
        reject(new Error('Failed to preprocess image: ' + err.message));
      }
    };
    img.onerror = () => reject(new Error('Failed to load image for preprocessing'));
    img.src = imageDataUrl;
  });
}

async function analyzeWithGroq(imageDataUrl) {
  if (validKeys.length === 0) {
    throw new Error('No Groq API keys available. Please add at least one key.');
  }

  const processedImage = await preprocessImageForAnalysis(imageDataUrl);
  const imageSeed = fnv1aSeed(processedImage);

  const maxKeyAttempts = validKeys.length * 2;
  let lastError = null;
  
  for (let attempt = 0; attempt < maxKeyAttempts; attempt++) {
    const apiKey = getNextApiKey();
    
    const requestBody = JSON.stringify({
      model: GROQ_VISION_MODEL,
      messages: [
        {
          role: 'user',
          content: [
            { type: 'text', text: ANALYSIS_SCHEMA_PROMPT },
            { 
              type: 'image_url', 
              image_url: { 
                url: processedImage,
                detail: 'high'
              } 
            },
          ],
        },
      ],
      temperature: 0.1,
      top_p: 0.9,
      seed: imageSeed,
      max_tokens: 2048,
      response_format: { type: 'json_object' },
    });

    const endpoint = 'https://api.groq.com/openai/v1/chat/completions';
    const fetchOpts = {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`,
      },
      body: requestBody,
    };

    try {
      const res = await fetch(endpoint, fetchOpts);
      
      if (res.ok) {
        const data = await res.json();
        const text = (data?.choices?.[0]?.message?.content || '').trim();
        if (!text) {
          throw new Error('Groq returned an empty response.');
        }
        
        const cleaned = text.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
        try {
          const parsed = JSON.parse(cleaned);
          const result = sanitizeAnalysis(parsed);
          
          if (result.healthScore < 10 || result.moisture < 0) {
            throw new Error('Analysis returned implausible values. Retrying with next key...');
          }
          
          return result;
        } catch (parseErr) {
          throw new Error('Could not parse the AI response. The image may be unclear.');
        }
      }
      
      let detail = '';
      try { 
        const errData = await res.json();
        detail = errData.error?.message || errData.message || '';
      } catch (e) {}
      
      const isKeyError = res.status === 401 || res.status === 403 || 
                         (detail && (detail.includes('quota') || detail.includes('credit') || detail.includes('rate limit')));
      
      if (isKeyError) {
        console.warn(`API key failed (${res.status}): ${detail}. Trying next key...`);
        lastError = `Key failed: ${detail}`;
        continue;
      }
      
      const retryable = res.status === 503 || res.status === 500 || res.status === 429 || res.status === 408;
      if (!retryable) {
        throw new Error(`Groq API error (${res.status}): ${detail || 'Request failed'}`);
      }
      
      await new Promise(r => setTimeout(r, 800 * (attempt % 3 + 1)));
      lastError = detail;
      
    } catch (err) {
      lastError = err.message;
      if (err.message.includes('parse') || err.message.includes('network') || err.message.includes('fetch')) {
        console.warn(`Error with key: ${err.message}. Trying next key...`);
        continue;
      }
      throw err;
    }
  }
  
  throw new Error(`All API keys failed after ${maxKeyAttempts} attempts. Last error: ${lastError}`);
}

  if (value >= 30) return { label: 'Below Optimal', color: '#d6a04a' };

function accuracyBadge(level) {

function circularGauge(label, value, subtitle, color = 'var(--primary)') {

          <circle class="circle-fg" cx="70" cy="70" r="${radius}" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" style="stroke:${color}; filter:drop-shadow(0 0 7px color-mix(in srgb, ${color} 55%, transparent));" />
        </svg>

// ================= CAMERA FUNCTIONS =================
async function startCamera(sourceView) {
  state.error = null;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    state.error = 'Camera access is not supported in this browser. Please upload a photo instead.';
    renderView(sourceView === 'scan' ? 'scan' : 'home');
    return;
  }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    state.cameraActive = true;
    renderView(sourceView === 'scan' ? 'scan' : 'home');
  } catch (err) {
    console.error(err);
    state.cameraActive = false;
    state.error = err.name === 'NotAllowedError'
      ? 'Camera access was denied. Please allow camera permissions and try again, or upload a photo.'
      : 'Could not access the camera. Please upload a photo instead.';
    renderView(sourceView === 'scan' ? 'scan' : 'home');
  }
}

function attachCameraStream() {
  const video = document.getElementById('scan-camera-video');
  if (video && cameraStream) {
    video.srcObject = cameraStream;
    video.play().catch(() => {});
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  state.cameraActive = false;
}

function capturePhoto(sourceView) {
  const video = document.getElementById('scan-camera-video');
  const canvas = document.getElementById('scan-camera-canvas');
  if (!video || !canvas || !video.videoWidth) return;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  state.imagePreview = canvas.toDataURL('image/jpeg', 0.95);
  state.error = null;
  stopCamera();
  renderView(sourceView === 'scan' ? 'scan' : 'home');
}

      <div>
        <div class="eyebrow">Crop Matching</div>
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
          <div>
            <h2 style="font-size:1.8rem; margin-bottom:0.5rem;">AI Crop Suggestions</h2>
            <p style="color:var(--text-muted);">Personalized planting recommendations based on your latest soil analysis.</p>
          </div>
          <div style="display:flex; gap:0.5rem; align-items:center;">
            <label style="font-size:0.75rem; color:var(--text-muted);">AI Enhancement:</label>
            <button class="btn-secondary" id="toggle-ai-btn" style="padding:0.4rem 0.8rem; font-size:0.7rem; width:auto; ${state.usingAISuggestions ? 'border-color:var(--primary);color:var(--primary-bright);' : ''}">
              ${state.usingAISuggestions ? '✅ AI On' : '⏹ AI Off'}
            </button>
          </div>
        </div>
        ${state.analysis ? accuracyBadge(state.analysisAccuracy) : ''}
        ${state.cropPreferences.length > 0 ? `<div style="margin-top:0.5rem; font-size:0.85rem; color:var(--text-muted);">🌱 Prioritizing your preferred crops: ${state.cropPreferences.join(', ')}</div>` : '<div style="margin-top:0.5rem; font-size:0.85rem; color:var(--text-faint);">💡 Add crop preferences in the Crop Preferences section to get personalized rankings.</div>'}
        ${state.analysis ? `<div style="margin-top:0.5rem; font-size:0.75rem; color:var(--text-faint);">📊 Scoring based on: Soil Type, Moisture, pH, Nutrients, Climate, and Disease Risk</div>` : ''}
        ${state.analysis && state.analysis.disease.detected ? `<div style="margin-top:0.5rem; font-size:0.8rem; color:var(--danger);">⚠️ Disease detected: ${state.analysis.disease.message} (${state.analysis.disease.severity}) — This affects crop recommendations.</div>` : ''}
      </div>
      
      <div style="display:flex; flex-direction:column; gap:0.75rem;">
        ${cropResults.slice(0, 15).map((crop, i) => {
          const scoreColor = crop.score >= 80 ? '#4caf50' : crop.score >= 65 ? '#8bc34a' : crop.score >= 50 ? '#ffc107' : '#ff5722';
          const matchClass = crop.score >= 80 ? 'match-perfect' : crop.score >= 65 ? 'match-good' : crop.score >= 50 ? 'match-fair' : 'match-poor';
          const isPreferred = state.cropPreferences.includes(crop.name);
          
          const cropInfo = crop.cropInfo || CROP_DATABASE[crop.name] || { growingSeason: 120, waterRequirement: 'Moderate' };
          
          return `
            <div class="crop-detail-card ${matchClass}" style="position:relative;">
              ${isPreferred ? `<div style="position:absolute; top:0; right:0; background:rgba(143,169,58,0.2); color:var(--primary-bright); padding:0.15rem 0.6rem; font-size:0.6rem; border-bottom-left-radius:6px;">⭐ Preferred #${state.cropPreferences.indexOf(crop.name) + 1}</div>` : ''}
              ${crop.aiGenerated ? `<div style="position:absolute; top:0; right:${isPreferred ? '120px' : '0'}; background:rgba(99,102,241,0.15); color:#818cf8; padding:0.15rem 0.6rem; font-size:0.6rem; border-bottom-left-radius:6px; border-bottom-right-radius:${isPreferred ? '0' : '6px'};">🤖 AI-enhanced</div>` : ''}
              <div class="crop-header">
                <div style="display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;">
                  <span style="font-size:0.8rem; color:var(--text-faint);">#${crop.rank}</span>
                  <span class="crop-name">${crop.name}</span>
                  <span class="badge ${crop.score >= 80 ? 'badge-excellent' : crop.score >= 65 ? 'badge-success' : crop.score >= 50 ? 'badge-warning' : 'badge-danger'}">
                    ${crop.rankLabel}
                  </span>
                  ${crop.isPreferred ? `<span class="badge badge-success">⭐ Preferred</span>` : ''}
                </div>
                <div class="crop-score" style="color:${scoreColor};">
                  ${crop.score}%
                </div>
              </div>
              <div class="crop-reason">${crop.aiReason || crop.cropInfo?.description || 'Suitable for your soil conditions.'}</div>
              <div class="crop-details">
                <div class="detail-item">
                  ${svgIcon('calendar', 14, 'var(--text-faint)')}
                  <span>Growing Season: ${crop.aiGrowingSeason || `${cropInfo.growingSeason || 120} days`}</span>
                </div>
                <div class="detail-item">
                  ${svgIcon('droplet', 14, 'var(--text-faint)')}
                  <span>Water: ${crop.aiWaterRequirement || cropInfo.waterRequirement || 'Moderate'}</span>
                </div>
                <div class="detail-item">
                  ${svgIcon('thermometer', 14, 'var(--text-faint)')}
                  <span>Temp: ${cropInfo.temperatureRange ? `${cropInfo.temperatureRange.min}°C - ${cropInfo.temperatureRange.max}°C` : 'Varies'}</span>
                </div>
              </div>
              ${crop.details ? `
                <div style="margin-top:0.5rem; display:flex; flex-wrap:wrap; gap:0.3rem;">
                  ${crop.details.slice(0, 4).map(d => `
                    <span style="font-size:0.65rem; background:var(--bg-card); border:1px solid var(--border-color); border-radius:3px; padding:0.1rem 0.4rem; color:${d.score > 5 ? 'var(--primary-bright)' : 'var(--text-faint)'};">
                      ${d.factor}: ${d.score > 5 ? '✅' : d.score > 0 ? '⚠️' : '❌'} ${Math.round(d.score)}/${d.max}
                    </span>
                  `).join('')}
                </div>
              ` : ''}
              <div style="margin-top:0.75rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
                ${(crop.aiEquipment || cropInfo.equipment || ['General Tools']).slice(0, 3).map(e => `
                  <span style="font-size:0.7rem; background:var(--bg-input); border:1px solid var(--border-color); border-radius:4px; padding:0.2rem 0.6rem; color:var(--text-muted);">🔧 ${e}</span>
                `).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>
      
      ${!state.analysis ? `
        <div class="panel" style="text-align:center; padding:2rem; color:var(--text-faint);">
          ${svgIcon('scan', 40, 'var(--text-faint)')}
          <p style="margin-top:1rem;">Run a soil scan to get accurate crop recommendations based on your actual soil conditions.</p>
          <button class="btn-primary" id="crops-goto-scan" style="margin-top:1rem; width:auto;">Go to Soil Scanner</button>
        </div>
      ` : ''}
    </div>
  `;
  
  const scanBtn = document.getElementById('crops-goto-scan');
  if (scanBtn) scanBtn.onclick = () => renderView('scan');
  
  const toggleBtn = document.getElementById('toggle-ai-btn');
  if (toggleBtn) {
    toggleBtn.onclick = () => {
      state.usingAISuggestions = !state.usingAISuggestions;
      if (state.analysis) {
        if (state.usingAISuggestions) {
          state.allCropSuggestions = generateAICropSuggestions(state.analysis, state.cropPreferences);
        } else {
          state.allCropSuggestions = getDetailedCropSuggestions(state.analysis, state.cropPreferences);
        }
      }
      renderCrops(container);
    };
  }
}

// ================= DISEASE VIEW =================
function renderDisease(container) {
  const a = state.analysis;
  const isHealthy = a ? !a.disease.detected : true;
  const message = a ? a.disease.message : 'No Disease Detected';
  const subtext = a ? a.disease.subtext : 'Great news! Your soil is healthy.';
  
  const severityColor = {
    'Severe': 'var(--disease-severe)',
    'Moderate': 'var(--disease-moderate)',
    'Mild': 'var(--disease-mild)',
    'None': 'var(--disease-healthy)'
  };
  
  const severityEmoji = {
    'Severe': '🚨',
    'Moderate': '⚠️',
    'Mild': '🔶',
    'None': '✅'
  };
  
  container.innerHTML = `
    <div class="view-page" style="height:100%;">
      <div>
        <div class="eyebrow">Pathology</div>
        <h2 style="font-size:1.8rem; margin-bottom:0.5rem;">Pathology & Disease Detection</h2>
        <p style="color:var(--text-muted);">Advanced AI scanning for harmful pathogens and deficiencies.</p>
        ${a ? accuracyBadge(state.analysisAccuracy) : ''}
      </div>
      
      ${a ? `
        <div class="disease-stats-grid">
          <div class="disease-stat-card">
            <div class="stat-value" style="color:${isHealthy ? 'var(--disease-healthy)' : severityColor[a.disease.severity]};">${isHealthy ? '✅' : severityEmoji[a.disease.severity]}</div>
            <div class="stat-label">Status</div>
            <div style="font-size:0.8rem; margin-top:0.2rem; color:${isHealthy ? 'var(--disease-healthy)' : severityColor[a.disease.severity]};">${isHealthy ? 'Healthy' : a.disease.severity}</div>
          </div>
          <div class="disease-stat-card">
            <div class="stat-value" style="color:${a.disease.detected ? severityColor[a.disease.severity] : 'var(--disease-healthy)'};">${a.disease.detected ? '⚠️' : '✅'}</div>
            <div class="stat-label">Detection</div>
            <div style="font-size:0.8rem; margin-top:0.2rem; color:${a.disease.detected ? severityColor[a.disease.severity] : 'var(--disease-healthy)'};">${a.disease.detected ? 'Issues Found' : 'Clear'}</div>
          </div>
          <div class="disease-stat-card">
            <div class="stat-value" style="color:${a.healthScore >= 70 ? 'var(--disease-healthy)' : a.healthScore >= 40 ? 'var(--disease-mild)' : 'var(--disease-severe)'};">${a.healthScore}%</div>
            <div class="stat-label">Soil Health</div>
            <div style="font-size:0.8rem; margin-top:0.2rem; color:${a.healthScore >= 70 ? 'var(--disease-healthy)' : a.healthScore >= 40 ? 'var(--disease-mild)' : 'var(--disease-severe)'};">${healthStatus(a.healthScore).label}</div>
          </div>
          <div class="disease-stat-card">
            <div class="stat-value" style="color:${a.moisture >= 60 ? 'var(--disease-healthy)' : a.moisture >= 30 ? 'var(--disease-mild)' : 'var(--disease-severe)'};">${a.moisture}%</div>
            <div class="stat-label">Moisture</div>
            <div style="font-size:0.8rem; margin-top:0.2rem; color:${a.moisture >= 60 ? 'var(--disease-healthy)' : a.moisture >= 30 ? 'var(--disease-mild)' : 'var(--disease-severe)'};">${moistureStatus(a.moisture).label}</div>
          </div>
        </div>
        
        <div class="disease-card ${isHealthy ? 'disease-healthy' : a.disease.severity.toLowerCase()}">
          <div class="disease-header">
            <div class="disease-name">
              ${isHealthy ? '✅' : severityEmoji[a.disease.severity]} ${message}
              ${!isHealthy ? `<span class="disease-severity" style="background:${severityColor[a.disease.severity]}; color:#fff;">${a.disease.severity}</span>` : ''}
            </div>
            ${!isHealthy ? `<span class="badge badge-disease-${a.disease.severity.toLowerCase()}">${a.disease.severity} Risk</span>` : '<span class="badge badge-disease-healthy">No Disease</span>'}
          </div>
          <div class="disease-symptoms">${subtext}</div>
          
          ${!isHealthy && a.disease.symptoms && a.disease.symptoms.length > 0 && a.disease.symptoms[0] !== 'No visible symptoms' ? `
            <div style="margin-top:0.5rem;">
              <div style="font-size:0.75rem; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.3rem;">🔍 Detected Symptoms</div>
              <div style="display:flex; flex-wrap:wrap; gap:0.4rem;">
                ${a.disease.symptoms.slice(0, 4).map(s => `
                  <span style="font-size:0.8rem; background:var(--bg-card); border:1px solid var(--border-color); border-radius:4px; padding:0.25rem 0.75rem; color:var(--text-muted);">${s}</span>
                `).join('')}
              </div>
            </div>
          ` : ''}
          
          ${!isHealthy && a.disease.treatment && a.disease.treatment.length > 0 ? `
            <div style="margin-top:0.75rem; border-top:1px solid var(--border-color); padding-top:0.75rem;">
              <div style="font-size:0.75rem; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.3rem;">💊 Recommended Treatment</div>
              <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0.4rem;">
                ${a.disease.treatment.slice(0, 4).map(t => `
                  <div style="display:flex; align-items:flex-start; gap:0.4rem; background:var(--bg-input); padding:0.4rem 0.6rem; border-radius:4px; border:1px solid var(--border-color); font-size:0.8rem; color:var(--text-muted);">
                    <span style="color:var(--primary-bright);">✅</span>
                    <span>${t}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
          
          ${!isHealthy && a.disease.prevention && a.disease.prevention.length > 0 ? `
            <div style="margin-top:0.75rem; border-top:1px solid var(--border-color); padding-top:0.75rem;">
              <div style="font-size:0.75rem; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.3rem;">🛡️ Prevention Strategies</div>
              <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0.4rem;">
                ${a.disease.prevention.slice(0, 4).map(p => `
                  <div style="display:flex; align-items:flex-start; gap:0.4rem; background:var(--bg-input); padding:0.4rem 0.6rem; border-radius:4px; border:1px solid var(--border-color); font-size:0.8rem; color:var(--text-muted);">
                    <span style="color:var(--primary-bright);">🔹</span>
                    <span>${p}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      ` : `
        <div class="panel" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height:320px;">
          ${svgIcon('shield-check', 56, 'var(--text-faint)')}
          <h3 style="margin:1rem 0 0.5rem; font-size:1.2rem;">No Scan Data Yet</h3>
          <p style="color:var(--text-muted); max-width:340px;">Run a soil scan to detect diseases, identify pathogens, and get treatment recommendations.</p>
          <button class="btn-primary" id="disease-goto-scan" style="margin-top:1.5rem; width:auto;">${svgIcon('camera',16)} Go to Soil Scanner</button>
        </div>
      `}
    </div>`;
    
  const scanBtn = document.getElementById('disease-goto-scan');
  if (scanBtn) scanBtn.onclick = () => renderView('scan');
}

// ================= CROP PREFERENCE VIEW =================
function renderCropPreference(container) {
  const cropOptions = Object.keys(CROP_DATABASE);
  const availableCrops = cropOptions.filter(c => !state.cropPreferences.includes(c));
  const sortedPreferences = state.cropPreferences;
  
  // Generate preference results based on current analysis
  let prefResults = [];
  if (state.analysis && state.cropPreferences.length > 0) {
    prefResults = generateAICropSuggestions(state.analysis, state.cropPreferences)
      .filter(c => c.isPreferred)
      .sort((a, b) => a.preferenceRank - b.preferenceRank);
  }
  
  container.innerHTML = `
    <div class="view-page">
      <div>
        <div class="eyebrow">Crop Preferences</div>
        <h2 style="font-size:1.8rem; margin-bottom:0.5rem;">Your Crop Preferences</h2>
        <p style="color:var(--text-muted);">Add crops you're interested in growing. The AI will prioritize these when suggesting crops based on your soil analysis.</p>
        ${state.cropPreferences.length > 0 ? `<div style="margin-top:0.5rem; font-size:0.85rem; color:var(--primary-bright);">🌱 ${state.cropPreferences.length} crop${state.cropPreferences.length !== 1 ? 's' : ''} selected</div>` : ''}
      </div>
      
      <div class="panel">
        <h3 style="font-size:1rem; font-weight:600; margin-bottom:1rem;">Add a Crop</h3>
        <div class="input-group">
          <select id="crop-select" class="glass-input" style="flex:1;">
            <option value="">Select a crop...</option>
            ${availableCrops.map(c => `<option value="${c}">${c}</option>`).join('')}
          </select>
          <button class="btn-primary" id="add-crop-btn" style="width:auto; padding:0.8rem 2rem;" ${availableCrops.length === 0 ? 'disabled' : ''}>
            ${svgIcon('plus',16)} Add Crop
          </button>
        </div>
        ${availableCrops.length === 0 ? '<p style="color:var(--primary-bright); font-size:0.85rem;">✅ All available crops have been added to your preferences.</p>' : ''}
      </div>
      
      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
          <h3 style="font-size:1rem; font-weight:600;">Your Preferred Crops</h3>
          <span style="font-size:0.85rem; color:var(--text-faint);">${sortedPreferences.length} crop${sortedPreferences.length !== 1 ? 's' : ''} selected</span>
        </div>
        
        ${sortedPreferences.length === 0 ? `
          <div style="text-align:center; padding:2rem 0; color:var(--text-faint);">
            ${svgIcon('sprout', 40, 'var(--text-faint)')}
            <p style="margin-top:1rem;">No crops added yet. Use the form above to add crops you're interested in.</p>
          </div>
        ` : `
          <div style="display:flex; flex-direction:column; gap:0.5rem;">
            ${sortedPreferences.map((crop, index) => `
              <div class="crop-preference-item">
                <div style="display:flex; align-items:center; gap:1rem; flex-wrap:wrap;">
                  <span style="color:var(--text-faint); font-size:0.8rem; min-width:2rem;">#${index + 1}</span>
                  <span class="crop-name">${crop}</span>
                  ${index === 0 ? '<span class="badge badge-success">Highest Priority</span>' : ''}
                  ${state.analysis ? `<span class="badge badge-primary">${prefResults.find(c => c.name === crop)?.score || '?'}% Match</span>` : ''}
                </div>
                <div class="crop-actions">
                  ${index > 0 ? `<button class="btn-secondary crop-move-up" data-index="${index}" style="padding:0.3rem 0.6rem; font-size:0.7rem; width:auto;">↑</button>` : ''}
                  ${index < sortedPreferences.length - 1 ? `<button class="btn-secondary crop-move-down" data-index="${index}" style="padding:0.3rem 0.6rem; font-size:0.7rem; width:auto;">↓</button>` : ''}
                  <button class="btn-danger crop-remove" data-crop="${crop}">Remove</button>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      </div>
      
      ${prefResults.length > 0 ? `
        <div class="panel" style="border-color: rgba(143,169,58,0.3);">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem;">
            <h3 style="font-size:1rem; font-weight:600;">🎯 Personalized Crop Recommendations</h3>
            <span class="badge badge-success">${prefResults.length} Preferred Crops</span>
          </div>
          <p style="color:var(--text-muted); margin-bottom:1rem;">Based on your soil analysis and preferred crops, here are your personalized results:</p>
          <div style="display:flex; flex-direction:column; gap:0.75rem;">
            ${prefResults.map((crop, i) => {
              const scoreColor = crop.score >= 80 ? '#4caf50' : crop.score >= 65 ? '#8bc34a' : crop.score >= 50 ? '#ffc107' : '#ff5722';
              const scoreClass = crop.score >= 80 ? 'excellent' : crop.score >= 65 ? 'good' : crop.score >= 50 ? 'fair' : 'poor';
              const priorityClass = i === 0 ? 'priority-1' : i === 1 ? 'priority-2' : i === 2 ? 'priority-3' : i === 3 ? 'priority-4' : 'priority-5';
              
              return `
                <div class="preference-result-card">
                  <div class="priority-badge ${priorityClass}">Priority #${i + 1}</div>
                  <div class="crop-header">
                    <div class="crop-name">
                      ${svgIcon('sprout', 20, scoreColor)}
                      ${crop.name}
                      ${crop.aiGenerated ? `<span style="font-size:0.6rem; color:#818cf8;">🤖 AI-enhanced</span>` : ''}
                    </div>
                    <div class="crop-score" style="color:${scoreColor};">${crop.score}%</div>
                  </div>
                  <div class="crop-reason">${crop.aiReason || crop.cropInfo?.description || 'Suitable for your soil conditions.'}</div>
                  <div class="match-details">
                    <div class="detail-item">
                      ${svgIcon('calendar', 14, 'var(--text-faint)')}
                      <span>Growing Season: <span class="value">${crop.aiGrowingSeason || `${crop.cropInfo?.growingSeason || 120} days`}</span></span>
                    </div>
                    <div class="detail-item">
                      ${svgIcon('droplet', 14, 'var(--text-faint)')}
                      <span>Water: <span class="value">${crop.aiWaterRequirement || crop.cropInfo?.waterRequirement || 'Moderate'}</span></span>
                    </div>
                    <div class="detail-item">
                      ${svgIcon('thermometer', 14, 'var(--text-faint)')}
                      <span>Temp: <span class="value">${crop.cropInfo?.temperatureRange ? `${crop.cropInfo.temperatureRange.min}°C - ${crop.cropInfo.temperatureRange.max}°C` : 'Varies'}</span></span>
                    </div>
                  </div>
                  <div class="score-bar">
                    <div class="fill ${scoreClass}" style="width: ${crop.score}%;"></div>
                  </div>
                  <div style="margin-top:0.5rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
                    ${(crop.aiEquipment || crop.cropInfo?.equipment || ['General Tools']).slice(0, 3).map(e => `
                      <span style="font-size:0.65rem; background:var(--bg-card); border:1px solid var(--border-color); border-radius:4px; padding:0.15rem 0.5rem; color:var(--text-muted);">🔧 ${e}</span>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      ` : state.analysis ? `
        <div class="panel" style="border-color: rgba(143,169,58,0.2); text-align:center; padding:1.5rem;">
          <p style="color:var(--text-muted);">No preferred crops added yet. Add crops above to see personalized recommendations.</p>
        </div>
      ` : `
        <div class="panel" style="border-color: rgba(143,169,58,0.2); text-align:center; padding:1.5rem;">
          <p style="color:var(--text-muted);">Run a soil scan first, then add your preferred crops to get accurate personalized recommendations.</p>
          <button class="btn-primary" id="pref-goto-scan" style="margin-top:0.75rem; width:auto;">Go to Scan Soil</button>
        </div>
      `}
      
      <div style="display:flex; gap:1rem; flex-wrap:wrap;">
        <button class="btn-secondary" id="back-to-scan-btn" style="width:auto;">← Back to Scanner</button>
        ${state.analysis ? `<button class="btn-primary" id="update-recommendations-btn" style="width:auto;">🔄 Update AI Recommendations</button>` : ''}
      </div>
    </div>
  `;
  
  // Event handlers
  const addBtn = document.getElementById('add-crop-btn');
  const select = document.getElementById('crop-select');
  
  if (addBtn && select) {
    addBtn.onclick = () => {
      const crop = select.value;
      if (crop && !state.cropPreferences.includes(crop)) {
        state.cropPreferences.push(crop);
        if (state.analysis) {
          state.allCropSuggestions = generateAICropSuggestions(state.analysis, state.cropPreferences);
        }
        renderCropPreference(container);
      }
    };
    select.onchange = () => {
      if (addBtn) addBtn.disabled = !select.value;
    };
  }
  
  document.querySelectorAll('.crop-remove').forEach(btn => {
    btn.onclick = () => {

      }
      renderCropPreference(container);

  document.querySelectorAll('.crop-move-up').forEach(btn => {
    btn.onclick = () => {
      const index = parseInt(btn.dataset.index);
      if (index > 0) {
        [state.cropPreferences[index], state.cropPreferences[index - 1]] = 
        [state.cropPreferences[index - 1], state.cropPreferences[index]];
        if (state.analysis) {
          state.allCropSuggestions = generateAICropSuggestions(state.analysis, state.cropPreferences);
        }
        renderCropPreference(container);
      }

  document.querySelectorAll('.crop-move-down').forEach(btn => {

        [state.cropPreferences[index], state.cropPreferences[index + 1]] = 
        [state.cropPreferences[index + 1], state.cropPreferences[index]];
        if (state.analysis) {
          state.allCropSuggestions = generateAICropSuggestions(state.analysis, state.cropPreferences);
        }
        renderCropPreference(container);

  const backBtn = document.getElementById('back-to-scan-btn');
  if (backBtn) {
    backBtn.onclick = () => {

  const updateBtn = document.getElementById('update-recommendations-btn');

      if (state.analysis) {

        renderCropPreference(container);

  const scanBtn = document.getElementById('pref-goto-scan');
  if (scanBtn) {
    scanBtn.onclick = () => {
      state.currentSubView = 'scan-main';
      renderView('scan');
    };
  }

// ================= REPORTS VIEW =================
function sanitizePdfText(s) {
  return String(s)
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/[\u2013\u2014]/g, '-')
    .replace(/\u2026/g, '...')
    .replace(/[^\x00-\x7F]/g, '');
}
function escapePdfText(s) {
  return sanitizePdfText(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
}
function wrapPlainText(text, maxChars) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let cur = '';
  words.forEach(w => {
    if ((cur + ' ' + w).trim().length > maxChars) {
      if (cur) lines.push(cur);
      cur = w;
    } else {
      cur = (cur ? cur + ' ' : '') + w;
    }
  });
  if (cur) lines.push(cur);
  return lines;
}
function buildAnalysisPdfLines(a) {
  const lines = [];
  const push = (text, size, bold) => lines.push({ text, size: size || 10.5, bold: !!bold });
  const gap = () => lines.push({ text: '', size: 6 });
  const wrapped = (text, maxChars) => wrapPlainText(text, maxChars || 92).forEach(l => push(l));

  push('Tilth - Soil Analysis Report', 17, true);
  push(`Generated: ${new Date().toLocaleString()}`, 9);
  push(`Model: ${GROQ_VISION_MODEL}`, 9);
  if (state.cropPreferences.length > 0) {
    push(`Preferred Crops: ${state.cropPreferences.join(', ')}`, 9);
  }
  if (state.usingAISuggestions) {
    push('AI-Enhanced Crop Recommendations: Enabled', 9);
  }
  gap();

  push('Overview', 13, true);
  push(`Health Score: ${a.healthScore}/100`);
  push(`Moisture: ${a.moisture}%`);
  push(`Soil Type: ${a.analysisDetails.soilType}`);
  push(`Moisture Reading: ${a.analysisDetails.moistureRaw}`);
  push(`Organic Matter: ${a.analysisDetails.organicMatter}`);
  gap();

  push('Nutrients', 13, true);
  push(`Nitrogen: ${a.nutrients.nitrogen.value} (${a.nutrients.nitrogen.status})`);
  push(`Phosphorus: ${a.nutrients.phosphorus.value} (${a.nutrients.phosphorus.status})`);
  push(`Potassium: ${a.nutrients.potassium.value} (${a.nutrients.potassium.status})`);
  push(`pH: ${a.nutrients.ph.value} (${a.nutrients.ph.status})`);
  gap();

  push('Pathology', 13, true);
  push(`${a.disease.message} (${a.disease.severity})`);
  wrapped(a.disease.subtext);
  if (a.disease.detected && a.disease.symptoms && a.disease.symptoms.length > 0) {
    push('Symptoms:', 11, true);
    a.disease.symptoms.forEach(s => push(`- ${s}`));
  }
  if (a.disease.detected && a.disease.treatment && a.disease.treatment.length > 0) {
    push('Treatment:', 11, true);
    a.disease.treatment.forEach(t => push(`- ${t}`));
  }
  gap();

  push('AI Recommendations', 13, true);
  a.recommendations.forEach((r, i) => wrapped(`${i + 1}. ${r}`));
  gap();

  push('Top Crop Suggestions', 13, true);
  const topCrops = state.allCropSuggestions.slice(0, 5);
  topCrops.forEach(c => {
    push(`${c.name} - ${c.score}% Match (${c.rankLabel})`, 11, true);
    wrapped(c.aiReason || c.cropInfo?.description || '');
    if (c.aiGenerated) push('(AI-Enhanced Recommendation)', 9);
    if (c.isPreferred) push(`(⭐ Preferred Crop #${c.preferenceRank})`, 9);
    gap();
  });

  return lines;
}
function buildMachineryPdfLines(a) {
  const lines = [];
  const push = (text, size, bold) => lines.push({ text, size: size || 10.5, bold: !!bold });
  const gap = () => lines.push({ text: '', size: 6 });
  const wrapped = (text, maxChars) => wrapPlainText(text, maxChars || 92).forEach(l => push(l));

  push('Tilth - Farm Machinery & Tools Report', 17, true);
  push(`Generated: ${new Date().toLocaleString()}`, 9);
  push(`Model: ${GROQ_VISION_MODEL}`, 9);
  if (state.cropPreferences.length > 0) {
    push(`Preferred Crops: ${state.cropPreferences.join(', ')}`, 9);
  }
  wrapped('Recommended machines and tools for each AI-suggested crop, based on your latest soil scan.');
  gap();

  const topCrops = state.allCropSuggestions.slice(0, 5);
  topCrops.forEach(c => {
    push(`${c.name} - ${c.score}% Match (${c.rankLabel})`, 12, true);
    if (c.isPreferred) push(`⭐ Preferred Crop #${c.preferenceRank}`, 9);
    const equip = c.aiEquipment || c.cropInfo?.equipment || ['General farming equipment'];
    equip.forEach(item => wrapped(`- ${item}`));
    if (c.aiGenerated) push('(AI-Enhanced Recommendation)', 9);
    gap();
  });

  return lines;
}
function buildPdfFromLines(lines) {
  const pageWidth = 612, pageHeight = 792, marginX = 50, marginTop = 742, marginBottom = 50;
  const pages = [];
  let curPage = [];
  let y = marginTop;
  const flushPage = () => { if (curPage.length) pages.push(curPage); curPage = []; y = marginTop; };
  lines.forEach(ln => {
    const size = ln.size || 10.5;
    const leading = size * 1.35 + (ln.text === '' ? 4 : 0);
    if (y - leading < marginBottom) flushPage();
    if (ln.text !== '') curPage.push({ text: ln.text, size, bold: !!ln.bold, y });
    y -= leading;
  });
  flushPage();
  if (!pages.length) pages.push([]);

  let nextObjNum = 3;
  const pageObjNums = [], contentObjNums = [];
  pages.forEach(() => { pageObjNums.push(nextObjNum++); contentObjNums.push(nextObjNum++); });
  const fontRegNum = nextObjNum++;
  const fontBoldNum = nextObjNum++;

  const contentStrings = pages.map(pageLines => {
    let s = '';
    pageLines.forEach(l => {
      const font = l.bold ? '/F2' : '/F1';
      s += `BT ${font} ${l.size} Tf 1 0 0 1 ${marginX} ${l.y.toFixed(2)} Tm (${escapePdfText(l.text)}) Tj ET\n`;
    });
    return s;
  });

  const objects = {};
  objects[1] = `<< /Type /Catalog /Pages 2 0 R >>`;
  objects[2] = `<< /Type /Pages /Kids [${pageObjNums.map(n => n + ' 0 R').join(' ')}] /Count ${pages.length} >>`;
  pages.forEach((_, i) => {
    objects[pageObjNums[i]] = `<< /Type /Page /Parent 2 0 R /Resources << /Font << /F1 ${fontRegNum} 0 R /F2 ${fontBoldNum} 0 R >> >> /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Contents ${contentObjNums[i]} 0 R >>`;
    const cs = contentStrings[i];
    objects[contentObjNums[i]] = `<< /Length ${cs.length} >>\nstream\n${cs}endstream`;
  });
  objects[fontRegNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>`;
  objects[fontBoldNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>`;

  const totalObjs = fontBoldNum;
  let pdf = '%PDF-1.4\n';
  const offsets = [0];
  for (let n = 1; n <= totalObjs; n++) {
    offsets[n] = pdf.length;
    pdf += `${n} 0 obj\n${objects[n]}\nendobj\n`;
  }
  const xrefOffset = pdf.length;
  pdf += `xref\n0 ${totalObjs + 1}\n0000000000 65535 f \n`;
  for (let n = 1; n <= totalObjs; n++) pdf += `${String(offsets[n]).padStart(10, '0')} 00000 n \n`;
  pdf += `trailer\n<< /Size ${totalObjs + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
  return pdf;
}
function downloadAnalysisReport(id, title, container) {
  const a = state.analysis;
  if (!a) return;
  const pdfString = buildPdfFromLines(buildAnalysisPdfLines(a));
  const blob = new Blob([pdfString], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `${title.replace(/ /g, '_')}.pdf`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  reportsDownloaded[id] = true;
  renderReports(container);
}
function downloadMachineryReport(id, title, container) {
  const a = state.analysis;
  if (!a) return;
  const pdfString = buildPdfFromLines(buildMachineryPdfLines(a));
  const blob = new Blob([pdfString], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `${title.replace(/ /g, '_')}.pdf`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  reportsDownloaded[id] = true;
  renderReports(container);
}
