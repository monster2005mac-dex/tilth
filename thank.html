<!-- thankyou.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thank You | Field Reading</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      linear-gradient(rgba(10, 8, 6, 0.78), rgba(10, 8, 6, 0.78)),
      url("https://images.unsplash.com/photo-1448375240586-882707db888b?fm=jpg&q=80&w=2000&auto=format&fit=crop")
        center / cover no-repeat fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .page {
    width: 100%;
    max-width: 520px;
    text-align: center;
    animation: fadeUp 0.8s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .icon-large {
    font-size: 64px;
    line-height: 1;
    margin-bottom: 20px;
    display: block;
  }

  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: 36px;
    color: #F1EDE1;
    margin-bottom: 12px;
  }

  .sub {
    font-size: 18px;
    color: #C9C7BC;
    line-height: 1.6;
    margin-bottom: 8px;
  }

  .sub-mono {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px;
    color: #6B6A60;
    margin-bottom: 28px;
  }

  .divider {
    width: 60px;
    height: 1.5px;
    background: rgba(143, 181, 66, 0.4);
    margin: 0 auto 28px;
  }

  /* ---------- Feedback / Rating ---------- */

  .feedback-card {
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 28px 24px 24px;
    background: rgba(255,255,255,0.015);
    text-align: left;
    margin-bottom: 24px;
  }

  .feedback-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #8FB542;
    margin-bottom: 4px;
  }

  .feedback-sub {
    font-size: 13px;
    color: #9C9A90;
    margin-bottom: 16px;
  }

  .stars {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .star-btn {
    background: none;
    border: none;
    font-size: 32px;
    line-height: 1;
    cursor: pointer;
    color: #4A4944;
    transition: color 0.15s, transform 0.15s;
    padding: 0 2px;
  }
  .star-btn:hover { transform: scale(1.1); }
  .star-btn.active { color: #f5b342; }
  .star-btn.active:hover { color: #e6a030; }

  .feedback-textarea {
    width: 100%;
    padding: 12px 14px;
    background: #0F0C09;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px;
    font-size: 15px;
    color: #F1EDE1;
    outline: none;
    font-family: inherit;
    resize: vertical;
    min-height: 80px;
    transition: border-color 0.15s ease;
    margin-bottom: 14px;
  }
  .feedback-textarea::placeholder { color: #4A4944; }
  .feedback-textarea:focus {
    border-color: #8FB542;
    box-shadow: 0 0 0 3px rgba(143, 181, 66, 0.12);
  }

  .feedback-actions {
    display: flex;
    gap: 10px;
  }

  .submit-feedback-btn {
    flex: 1;
    padding: 12px;
    border-radius: 3px;
    background: #8FB542;
    border: none;
    color: #17130F;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s;
  }
  .submit-feedback-btn:hover { background: #A0C956; }
  .submit-feedback-btn:disabled { opacity: 0.5; cursor: default; }

  .skip-feedback-btn {
    padding: 12px 20px;
    border-radius: 3px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.12);
    color: #6B6A60;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .skip-feedback-btn:hover {
    color: #9C9A90;
    border-color: rgba(255,255,255,0.2);
  }

  .feedback-status {
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.5;
  }
  .feedback-status.success { color: #8FB542; }
  .feedback-status.error { color: #E29A5A; }
  .feedback-status.info { color: #C9C7BC; }

  /* ---------- back to login ---------- */

  .back-link {
    display: inline-block;
    margin-top: 8px;
    font-size: 14px;
    color: #6B6A60;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.06);
    padding: 12px 32px;
    border-radius: 3px;
    transition: color 0.15s, border-color 0.15s;
  }
  .back-link:hover {
    color: #F1EDE1;
    border-color: rgba(255,255,255,0.15);
  }

  .mono {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
</style>
</head>
<body>

<div class="page">

  <span class="icon-large">🌿</span>
  <h1>See you soon!</h1>
  <p class="sub">You've been logged out.</p>
  <p class="sub-mono">We hope you enjoyed your time with Tilth.</p>

  <div class="divider"></div>

  <!-- Feedback / Rating Section -->
  <div class="feedback-card">
    <div class="feedback-title">★ Share your thoughts</div>
    <div class="feedback-sub">How was your experience today?</div>

    <div class="stars" id="starContainer">
      <button type="button" class="star-btn" data-value="1">☆</button>
      <button type="button" class="star-btn" data-value="2">☆</button>
      <button type="button" class="star-btn" data-value="3">☆</button>
      <button type="button" class="star-btn" data-value="4">☆</button>
      <button type="button" class="star-btn" data-value="5">☆</button>
    </div>

    <textarea class="feedback-textarea" id="feedbackText" placeholder="What did you like? What could be better? (optional)"></textarea>

    <div class="feedback-actions">
      <button type="button" class="skip-feedback-btn mono" id="skipFeedbackBtn">Skip</button>
      <button type="button" class="submit-feedback-btn mono" id="submitFeedbackBtn">Submit Feedback</button>
    </div>

    <p class="feedback-status" id="feedbackStatus" style="display:none;"></p>
  </div>

  <a href="index.html" class="back-link mono">← Back to login</a>

</div>

<!-- Firebase (modular v10 SDK via CDN) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    serverTimestamp,
    getDocs,
    query,
    orderBy,
    limit
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Use the SAME config as your login and signup pages
  const firebaseConfig = {
    apiKey: "AIzaSyAQrRsdvW5fwv_3f_cv9NW255TRzg8rmts",
    authDomain: "tilth-ai.firebaseapp.com",
    projectId: "tilth-ai",
    storageBucket: "tilth-ai.firebasestorage.app",
    messagingSenderId: "631969995563",
    appId: "1:631969995563:web:9debf13b631071746f836e",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ============================================================
  // Star rating
  // ============================================================
  const starContainer = document.getElementById('starContainer');
  const starBtns = starContainer.querySelectorAll('.star-btn');
  let selectedRating = 0;

  starBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      const val = parseInt(btn.dataset.value, 10);
      selectedRating = val;
      updateStars(val);
    });

    btn.addEventListener('mouseenter', () => {
      const val = parseInt(btn.dataset.value, 10);
      updateStars(val, true);
    });

    btn.addEventListener('mouseleave', () => {
      updateStars(selectedRating);
    });
  });

  function updateStars(rating, hover = false) {
    starBtns.forEach((btn) => {
      const val = parseInt(btn.dataset.value, 10);
      if (val <= rating) {
        btn.textContent = '★';
        btn.classList.add('active');
      } else {
        btn.textContent = '☆';
        btn.classList.remove('active');
      }
    });
  }

  // ============================================================
  // Submit feedback to Firestore
  // ============================================================
  const feedbackText = document.getElementById('feedbackText');
  const submitBtn = document.getElementById('submitFeedbackBtn');
  const skipBtn = document.getElementById('skipFeedbackBtn');
  const statusEl = document.getElementById('feedbackStatus');

  function showStatus(message, type) {
    statusEl.textContent = message;
    statusEl.className = 'feedback-status ' + type;
    statusEl.style.display = 'block';
  }

  function clearStatus() {
    statusEl.style.display = 'none';
    statusEl.textContent = '';
  }

  async function submitFeedback(rating, comment) {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';
    clearStatus();

    try {
      // Store feedback in Firestore "feedback" collection
      const docRef = await addDoc(collection(db, "feedback"), {
        rating: rating,
        comment: comment || '',
        createdAt: serverTimestamp(),
        source: 'logout_page',
        // Include browser info for debugging
        userAgent: navigator.userAgent || '',
        // Optional: get user email from localStorage if available
        // userEmail: localStorage.getItem('userEmail') || null,
      });

      console.log('Feedback saved with ID:', docRef.id);
      
      showStatus('Thank you! Your feedback helps us grow. 🌱', 'success');
      submitBtn.textContent = '✓ Sent';
      submitBtn.disabled = true;
      
      // Reset button after 3 seconds
      setTimeout(() => {
        submitBtn.textContent = 'Submit Feedback';
        submitBtn.disabled = false;
      }, 3000);

    } catch (err) {
      console.error('Error saving feedback:', err);
      showStatus('Could not send feedback. Please try again.', 'error');
      submitBtn.textContent = 'Submit Feedback';
      submitBtn.disabled = false;
    }
  }

  submitBtn.addEventListener('click', () => {
    if (selectedRating === 0) {
      showStatus('Please select a rating before submitting.', 'error');
      return;
    }
    submitFeedback(selectedRating, feedbackText.value.trim());
  });

  skipBtn.addEventListener('click', () => {
    clearStatus();
    showStatus('Thanks for visiting! You can always share feedback later.', 'info');
    setTimeout(() => {
      statusEl.style.display = 'none';
    }, 3000);
  });

  // ============================================================
  // (Optional) Test: Check if feedback collection exists
  // ============================================================
  async function checkFeedbackCollection() {
    try {
      const q = query(collection(db, "feedback"), orderBy("createdAt", "desc"), limit(1));
      const snapshot = await getDocs(q);
      console.log('Feedback collection exists. Total documents:', snapshot.size);
    } catch (err) {
      console.warn('Feedback collection not accessible yet:', err);
    }
  }
  
  // Uncomment to test if Firestore is working
  // checkFeedbackCollection();

  // ============================================================
  // Redirect after 15 seconds if user does nothing
  // ============================================================
  let redirectTimer = setTimeout(() => {
    window.location.href = 'login.html';
  }, 15000);

  // Cancel redirect if user interacts
  document.addEventListener('click', () => clearTimeout(redirectTimer));
  document.addEventListener('keydown', () => clearTimeout(redirectTimer));
</script>

</body>
</html>
