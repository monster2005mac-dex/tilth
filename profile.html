<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — Field Reading</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      linear-gradient(rgba(10, 8, 6, 0.72), rgba(10, 8, 6, 0.72)),
      url("https://images.unsplash.com/photo-1448375240586-882707db888b?fm=jpg&q=80&w=2000&auto=format&fit=crop")
        center / cover no-repeat fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .mono {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .page {
    width: 100%;
    max-width: 440px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.18em;
    color: #8FB542;
    margin-bottom: 20px;
    text-align: center;
  }

  /* ---------- tagline ---------- */

  .tagline {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 0 0 26px;
    opacity: 0;
    animation: taglineIn 1.1s ease forwards 0.25s;
  }

  @keyframes taglineIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .tagline-icon {
    flex-shrink: 0;
    color: #8FB542;
    opacity: 0.85;
  }

  .tagline-line {
    flex: 1;
    max-width: 26px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(143,181,66,0.55));
  }
  .tagline-line.right { background: linear-gradient(90deg, rgba(143,181,66,0.55), transparent); }

  .tagline-text {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 13.5px;
    letter-spacing: 0.01em;
    color: #C9C7BC;
    text-align: center;
    white-space: nowrap;
  }

  .tagline-text .hl {
    font-style: normal;
    font-weight: 700;
    color: #8FB542;
    letter-spacing: 0.02em;
  }

  /* ---------- quote ---------- */

  .quote-block {
    text-align: center;
    margin-bottom: 28px;
    padding: 0 12px;
  }

  .quote-mark {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 40px;
    line-height: 1;
    color: #8FB542;
    opacity: 0.7;
    display: block;
    margin-bottom: 4px;
  }

  .quote-text {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 16px;
    line-height: 1.55;
    color: #F1EDE1;
  }

  .quote-attribution {
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #8FB542;
    margin-top: 10px;
  }

  /* ---------- identity card ---------- */

  .identity-card {
    position: relative;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 32px 24px 26px;
    background: rgba(255,255,255,0.015);
    margin-bottom: 16px;
    text-align: center;
  }

  .identity-card::before, .identity-card::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
  }
  .identity-card::before {
    top: -1px; left: -1px;
    border-top: 1.5px solid rgba(241,237,225,0.35);
    border-left: 1.5px solid rgba(241,237,225,0.35);
  }
  .identity-card::after {
    top: -1px; right: -1px;
    border-top: 1.5px solid rgba(241,237,225,0.35);
    border-right: 1.5px solid rgba(241,237,225,0.35);
  }
  .identity-card .br-bl {
    position: absolute; bottom: -1px; left: -1px;
    width: 18px; height: 18px;
    border-bottom: 1.5px solid rgba(241,237,225,0.35);
    border-left: 1.5px solid rgba(241,237,225,0.35);
  }
  .identity-card .br-br {
    position: absolute; bottom: -1px; right: -1px;
    width: 18px; height: 18px;
    border-bottom: 1.5px solid rgba(241,237,225,0.35);
    border-right: 1.5px solid rgba(241,237,225,0.35);
  }

  .quote-mark {
    position: absolute;
    top: 10px;
    left: 16px;
    width: 34px;
    height: 34px;
    color: #8FB542;
    opacity: 0.22;
    pointer-events: none;
  }

  .avatar {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: rgba(143, 181, 66, 0.12);
    border: 1.5px solid #8FB542;
    object-fit: cover;
    display: block;
    margin: 0 auto 18px;
  }

  .identity-name-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  h1.display-name {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.2;
    color: #F1EDE1;
  }
  h1.display-name.placeholder { color: #6B6A60; font-style: italic; font-family: inherit; font-size: 16px; font-weight: 400; }

  .edit-icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #6B6A60;
    padding: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
  }
  .edit-icon-btn:hover { color: #8FB542; background: rgba(143,181,66,0.1); }

  .identity-email {
    font-size: 13px;
    color: #9C9A90;
    margin-bottom: 6px;
  }

  .member-since {
    font-size: 11.5px;
    color: #6B6A60;
    letter-spacing: 0.04em;
  }

  .verified-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    margin-top: 14px;
  }
  .verified-pill.yes { background: rgba(143,181,66,0.12); color: #8FB542; border: 1px solid rgba(143,181,66,0.4); }
  .verified-pill.no { background: rgba(226,154,90,0.1); color: #E29A5A; border: 1px solid rgba(226,154,90,0.35); }

  /* ---------- inline edit form ---------- */

  #editForm {
    display: none;
    text-align: left;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  #editForm.open { display: block; }

  .field-label {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: #6B6A60;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    background: #0F0C09;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px;
    font-size: 15px;
    color: #F1EDE1;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field input::placeholder { color: #4A4944; }
  .field input:focus {
    border-color: #8FB542;
    box-shadow: 0 0 0 3px rgba(143, 181, 66, 0.12);
  }

  .field .hint {
    font-size: 11.5px;
    color: #6B6A60;
    margin-top: 6px;
  }

  .status-msg {
    font-size: 12.5px;
    margin: 12px 0 0;
    line-height: 1.5;
  }
  .status-msg.error { color: #E29A5A; }
  .status-msg.success { color: #8FB542; }

  .edit-btn-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .save-btn {
    flex: 1;
    padding: 11px;
    border-radius: 3px;
    background: #8FB542;
    border: 1px solid #8FB542;
    color: #17130F;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .save-btn:hover { background: #A0C956; }
  .save-btn:disabled { opacity: 0.5; cursor: default; }

  .cancel-btn {
    flex: 1;
    padding: 11px;
    border-radius: 3px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: #9C9A90;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .cancel-btn:hover { background: rgba(255,255,255,0.03); }

  /* ---------- account overview grid ---------- */

  .section-heading {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: #6B6A60;
    text-transform: uppercase;
    margin: 22px 0 12px 2px;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat-card {
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 14px 14px 13px;
    background: rgba(255,255,255,0.015);
  }

  .stat-icon-row {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #8FB542;
    margin-bottom: 9px;
  }

  .stat-label {
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6B6A60;
  }

  .stat-value {
    font-size: 13.5px;
    color: #F1EDE1;
    line-height: 1.4;
    word-break: break-all;
  }
  .stat-value.dim { color: #6B6A60; font-style: italic; }

  .resend-link {
    display: inline-block;
    margin-top: 8px;
    background: none;
    border: none;
    padding: 0;
    font-size: 11px;
    color: #8FB542;
    text-decoration: underline;
    cursor: pointer;
  }
  .resend-link:hover { color: #A0C956; }
  .resend-link:disabled { color: #6B6A60; cursor: default; text-decoration: none; }

  .resend-status {
    margin-top: 6px;
    font-size: 11px;
    line-height: 1.4;
  }
  .resend-status.success { color: #8FB542; }
  .resend-status.error { color: #E29A5A; }

  /* ---------- footer actions ---------- */

  .primary-btn {
    display: block;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 3px;
    background: #8FB542;
    color: #17130F;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: background 0.15s ease;
  }
  .primary-btn:hover { background: #A0C956; }

  .logout-link {
    display: block;
    margin-top: 20px;
    font-size: 13px;
    color: #6B6A60;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-align: center;
    width: 100%;
  }
  .logout-link:hover { color: #9C9A90; }
</style>
</head>
<body>

  <div class="page">
    <p class="eyebrow mono">FIELD READING</p>

    <div class="tagline">
      <svg class="tagline-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="7" y="7" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M9 3.5V7M15 3.5V7M9 17v3.5M15 17v3.5M3.5 9H7M3.5 15H7M17 9h3.5M17 15h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="tagline-line"></span>
      <p class="tagline-text">&ldquo;Where <span class="hl">technology</span> meets <span class="hl">agriculture</span>.&rdquo;</p>
      <span class="tagline-line right"></span>
      <svg class="tagline-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 20c8 0 15-3 16-16C8 5 4 12 4 20z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M6.5 17.5C10 13 14 9.5 19 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="quote-block">
      <span class="quote-mark">&ldquo;</span>
      <p class="quote-text" id="quoteText">The mountains are calling, and I must go.</p>
      <p class="quote-attribution mono" id="quoteAttribution">John Muir</p>
    </div>

    <div class="identity-card">
      <div class="br-bl"></div>
      <div class="br-br"></div>

      <svg class="quote-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M6 26c0-9 5-15.5 13-18l1.8 4.2C15.4 14.2 12.7 18 12.4 23c1-.6 2.2-.9 3.6-.9 4.3 0 7.6 3.2 7.6 7.8 0 4.7-3.5 8.1-8.1 8.1C10.3 38 6 33.3 6 26z" fill="currentColor"/>
        <path d="M26 26c0-9 5-15.5 13-18l1.8 4.2c-5.4 2-8.1 5.8-8.4 10.8 1-.6 2.2-.9 3.6-.9 4.3 0 7.6 3.2 7.6 7.8 0 4.7-3.5 8.1-8.1 8.1-5.2 0-9.5-4.7-9.5-12z" fill="currentColor"/>
      </svg>

      <img class="avatar" id="avatarImg" src="" alt="Profile picture" />

      <div class="identity-name-row">
        <h1 class="display-name" id="displayName">—</h1>
        <button type="button" class="edit-icon-btn" id="editToggleBtn" title="Edit username" aria-label="Edit username">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 20h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <p class="identity-email mono" id="identityEmail">—</p>
      <p class="member-since mono" id="memberSince"></p>

      <span class="verified-pill mono" id="verifiedPill" style="display:none;"></span>

      <form id="editForm">
        <div class="field">
          <p class="field-label mono">Username</p>
          <input type="text" id="username" placeholder="fieldname" minlength="3" maxlength="20" autocomplete="username" />
          <p class="hint mono">3–20 characters. Letters, numbers, underscores only.</p>
        </div>

        <p class="status-msg mono" id="statusMsg" style="display:none;"></p>

        <div class="edit-btn-row">
          <button type="button" class="cancel-btn mono" id="cancelBtn">Cancel</button>
          <button type="submit" class="save-btn mono" id="saveBtn">Save</button>
        </div>
      </form>
    </div>

    <p class="section-heading mono">Account overview</p>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-icon-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span class="stat-label mono">Email verified</span>
        </div>
        <div class="stat-value mono" id="detailVerified">—</div>
        <button type="button" class="resend-link mono" id="resendVerifyBtn" style="display:none;">Resend verification email</button>
        <p class="resend-status mono" id="resendStatus" style="display:none;"></p>
      </div>

      <div class="stat-card">
        <div class="stat-icon-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="15" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 12.5 20 3M20 3v4M20 3h-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="stat-label mono">Sign-in method</span>
        </div>
        <div class="stat-value mono" id="detailProvider">—</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="stat-label mono">Account created</span>
        </div>
        <div class="stat-value mono" id="detailCreated">—</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="stat-label mono">Last sign-in</span>
        </div>
        <div class="stat-value mono" id="detailLastLogin">—</div>
      </div>
    </div>

    <a href="dash.html" class="primary-btn" id="startReadingBtn">Start reading soil</a>
    <button class="logout-link mono" id="logoutBtn">Log out</button>
  </div>

  <!-- Firebase (modular v10 SDK via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut,
      sendEmailVerification,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      collection,
      query,
      where,
      getDocs,
      limit,
      serverTimestamp,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Use the SAME config as your login and signup pages
    const firebaseConfig = {
      apiKey: "AIzaSyAQrRsdvW5fwv_3f_cv9NW255TRzg8rmts",
      authDomain: "tilth-ai.firebaseapp.com",
      projectId: "tilth-ai",
      storageBucket: "tilth-ai.firebasestorage.app",
      messagingSenderId: "631969995563",
      appId: "1:631969995563:web:9debf13b631071746f836e",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // A small pool of short farming / agtech quotes — one is picked at
    // random on each visit so the page feels a little fresh and inviting
    // to the growers and ag-tech folks using Tilth.
    const QUOTES = [
      { text: "The nation that destroys its soil destroys itself.", by: "Franklin D. Roosevelt" },
      { text: "Agriculture is the most healthful, most useful, and most noble employment of man.", by: "George Washington" },
      { text: "The farmer has to be an optimist or he wouldn't still be a farmer.", by: "Will Rogers" },
      { text: "Every field tells a story — technology just helps us listen.", by: "Tilth" },
      { text: "Data in the soil, wisdom in the harvest.", by: "Tilth" },
      { text: "The best fertilizer is the farmer's shadow — now it walks beside a sensor.", by: "Tilth" },
    ];
    const quoteTextEl = document.getElementById("quoteText");
    const quoteAttributionEl = document.getElementById("quoteAttribution");
    if (quoteTextEl && quoteAttributionEl) {
      const pick = QUOTES[Math.floor(Math.random() * QUOTES.length)];
      quoteTextEl.textContent = pick.text;
      quoteAttributionEl.textContent = pick.by;
    }

    const avatarImg = document.getElementById("avatarImg");
    const displayName = document.getElementById("displayName");
    const identityEmail = document.getElementById("identityEmail");
    const memberSince = document.getElementById("memberSince");
    const verifiedPill = document.getElementById("verifiedPill");

    const editToggleBtn = document.getElementById("editToggleBtn");
    const editForm = document.getElementById("editForm");
    const usernameInput = document.getElementById("username");
    const cancelBtn = document.getElementById("cancelBtn");
    const saveBtn = document.getElementById("saveBtn");
    const statusMsg = document.getElementById("statusMsg");
    const logoutBtn = document.getElementById("logoutBtn");

    const detailVerified = document.getElementById("detailVerified");
    const resendVerifyBtn = document.getElementById("resendVerifyBtn");
    const resendStatus = document.getElementById("resendStatus");
    const detailProvider = document.getElementById("detailProvider");
    const detailCreated = document.getElementById("detailCreated");
    const detailLastLogin = document.getElementById("detailLastLogin");

    // Generic placeholder avatar (simple person silhouette) — used unless
    // the signed-in account (e.g. via Google) has its own photo.
    const DEFAULT_AVATAR =
      "data:image/svg+xml;utf8," +
      encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 76">
          <circle cx="38" cy="38" r="38" fill="#1F1A14"/>
          <circle cx="38" cy="31" r="14" fill="#4A4944"/>
          <path d="M13 68c3-15 16-23 25-23s22 8 25 23" fill="#4A4944"/>
        </svg>
      `);

    const USERNAME_RE = /^[a-zA-Z0-9_]{3,20}$/;
    let currentUser = null;
    let currentUsername = "";
    let currentUsernameLower = null;

    function showStatus(message, type) {
      statusMsg.textContent = message;
      statusMsg.className = "status-msg mono " + type;
      statusMsg.style.display = "block";
    }
    function clearStatus() {
      statusMsg.style.display = "none";
      statusMsg.textContent = "";
    }

    function openEdit() {
      usernameInput.value = currentUsername;
      clearStatus();
      editForm.classList.add("open");
      usernameInput.focus();
    }
    function closeEdit() {
      editForm.classList.remove("open");
      clearStatus();
    }

    editToggleBtn.addEventListener("click", () => {
      if (editForm.classList.contains("open")) {
        closeEdit();
      } else {
        openEdit();
      }
    });
    cancelBtn.addEventListener("click", closeEdit);

    async function isUsernameTaken(usernameLower) {
      const usersRef = collection(db, "users");
      const q = query(usersRef, where("username_lower", "==", usernameLower), limit(1));
      const snap = await getDocs(q);
      if (snap.empty) return false;
      // Not taken if the only match is the current user's own doc.
      return snap.docs[0].id !== currentUser.uid;
    }

    function renderIdentity(username) {
      if (username) {
        displayName.textContent = username;
        displayName.classList.remove("placeholder");
      } else {
        displayName.textContent = "No username set";
        displayName.classList.add("placeholder");
      }
      avatarImg.alt = (username ? username : "Profile") + " picture";
    }

    // If nobody's actually logged in, send them back to the login page
    // instead of showing this page unprotected.
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      currentUser = user;
      identityEmail.textContent = user.email || "—";

      // Prefer the account's own photo (e.g. Google profile picture);
      // fall back to the generic avatar otherwise.
      avatarImg.src = user.photoURL || DEFAULT_AVATAR;

      const userRef = doc(db, "users", user.uid);
      const snap = await getDoc(userRef);
      const data = snap.exists() ? snap.data() : {};

      currentUsername = data.username || "";
      currentUsernameLower = data.username_lower || null;
      renderIdentity(currentUsername);

      if (data.createdAt && data.createdAt.toDate) {
        const d = data.createdAt.toDate();
        memberSince.textContent = "Member since " + d.toLocaleDateString();
      } else {
        memberSince.textContent = "";
      }

      // Everything below comes straight off the Firebase Auth user object.
      detailVerified.textContent = user.emailVerified ? "Yes" : "No";
      verifiedPill.style.display = "inline-flex";
      verifiedPill.className = "verified-pill mono " + (user.emailVerified ? "yes" : "no");
      verifiedPill.textContent = user.emailVerified ? "Verified" : "Not verified";

      const isPasswordAccount = user.providerData.some((p) => p.providerId === "password");
      resendVerifyBtn.style.display = !user.emailVerified && isPasswordAccount ? "inline-block" : "none";
      resendStatus.style.display = "none";

      const providers = user.providerData.map((p) => {
        if (p.providerId === "password") return "Email/password";
        if (p.providerId === "google.com") return "Google";
        return p.providerId;
      });
      detailProvider.textContent = providers.length ? providers.join(", ") : "—";

      detailCreated.textContent = user.metadata.creationTime
        ? new Date(user.metadata.creationTime).toLocaleDateString()
        : "—";
      detailLastLogin.textContent = user.metadata.lastSignInTime
        ? new Date(user.metadata.lastSignInTime).toLocaleString()
        : "—";
    });

    editForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearStatus();

      const username = usernameInput.value.trim();

      if (!username) {
        showStatus("Enter a username.", "error");
        return;
      }
      if (!USERNAME_RE.test(username)) {
        showStatus("Username must be 3–20 characters: letters, numbers, or underscores.", "error");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      try {
        const usernameLower = username.toLowerCase();
        if (usernameLower !== currentUsernameLower) {
          const taken = await isUsernameTaken(usernameLower);
          if (taken) {
            showStatus("That username is already taken.", "error");
            return;
          }
        }

        const userRef = doc(db, "users", currentUser.uid);
        const updates = {
          email: currentUser.email,
          username: username,
          username_lower: usernameLower,
        };
        // Only stamp createdAt the first time this doc gets a value —
        // don't let every save reset "member since".
        if (!currentUsernameLower && !memberSince.textContent) {
          updates.createdAt = serverTimestamp();
        }
        await setDoc(userRef, updates, { merge: true });

        currentUsername = username;
        currentUsernameLower = usernameLower;
        renderIdentity(currentUsername);

        if (!memberSince.textContent) {
          memberSince.textContent = "Member since " + new Date().toLocaleDateString();
        }

        showStatus("Saved.", "success");
        setTimeout(closeEdit, 700);
      } catch (err) {
        console.error(err);
        showStatus("Something went wrong saving your profile. Please try again.", "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save";
      }
    });

    // In the logoutBtn click handler, replace:
    logoutBtn.addEventListener("click", async () => {
    await signOut(auth);
    // Redirect to thank you page instead of login
    window.location.href = "thank.html";
    });

    resendVerifyBtn.addEventListener("click", async () => {
      if (!currentUser) return;

      resendVerifyBtn.disabled = true;
      resendStatus.style.display = "block";

      try {
        await sendEmailVerification(currentUser);
        resendStatus.className = "resend-status mono success";
        resendStatus.textContent = "Verification email sent — check your inbox.";

        // Simple cooldown so it can't be spammed; Firebase also
        // rate-limits this server-side.
        let secondsLeft = 60;
        resendVerifyBtn.textContent = `Resend in ${secondsLeft}s`;
        const interval = setInterval(() => {
          secondsLeft -= 1;
          if (secondsLeft <= 0) {
            clearInterval(interval);
            resendVerifyBtn.textContent = "Resend verification email";
            resendVerifyBtn.disabled = false;
          } else {
            resendVerifyBtn.textContent = `Resend in ${secondsLeft}s`;
          }
        }, 1000);
      } catch (err) {
        console.error(err);
        resendStatus.className = "resend-status mono error";
        resendStatus.textContent =
          err.code === "auth/too-many-requests"
            ? "Too many requests — try again in a bit."
            : "Couldn't send the email. Please try again.";
        resendVerifyBtn.disabled = false;
      }
    });
  </script>

</body>
